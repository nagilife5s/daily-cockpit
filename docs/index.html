    if (state.selectedDate === date && state.mode === 'today') { renderTodayTab(); return; }
    if (state.selectedDate === date && state.mode === 'week') renderDayPane();
  });
}
/* 起動時の表示日。平日ならその日、土日なら表示週の月曜（週グリッドは月〜金なので、
   土日に開いたときに空の土曜を見せない＝2026-09-18 以前のフォールバックの挙動を残す）。
   起動後は「今日」ボタンやカレンダーで土日も見られる */
function initialViewDate() {
  var t = resolveToday().date;
  var dw = dowOf(t);
  return (dw >= 1 && dw <= 5) ? t : mondayOf(t);
}

/* 表示日を変える唯一の入口。週グリッドには触らない（＝週は動かない） */
function setViewDate(d) {
  if (!d || state.selectedDate === d) return;
  state.selectedDate = d;
  ensureDay(d);
  withTransition(function () {
    renderDayPane();
    if (state.gridMode === 'day') renderGrid();   /* Day の表は表示日について動く */
    else renderWeekNote();      /* 「表の週の外の日を見ています」の出し分け */
  });
}
/* 週グリッドとの関係を1行で言う。嘘をつかず、1タップで揃えられるようにする */
function renderWeekNote() {
  var n = $('#weeknote');
  if (!n) return;
  n.textContent = '';
  var d = state.selectedDate;
  if (state.gridMode === 'day') return;    /* Day は表示日そのものを出しているので、ずれようがない */
  if (!d || !state.week || dayInWeek(d)) return;
  var ws = mondayOf(d);
  if (ws === state.weekStart) {            /* 表示週に付いている土日（グリッドは月〜金なので外） */
    n.textContent = '表示中の日（' + mdw(d) + '）は土日なので、表（月〜金）には出ません';
    return;
  }
  n.appendChild(document.createTextNode('表示中の日（' + mdw(d) + '）は、この表の週の外です'));
  var b = el('button', null, 'この日の週へ');
  b.type = 'button';
  b.addEventListener('click', function () { loadWeek(ws); });
  n.appendChild(b);
}

/* 開いている全ての日のコマ配列（週＋週外キャッシュ）。コマの検索・編集反映に使う */
function allSchedules() {
  var out = [];
  if (state.week && state.week.schedule) out.push(state.week.schedule);
  Object.keys(state.days).forEach(function (k) {
    if (state.days[k] && state.days[k].schedule) out.push(state.days[k].schedule);
  });
  return out;
}

/* ==========================================================================
   6-c. 時間帯軸（2026-09-18 大改修。README §12「次の大改修の予告」「時間帯軸」）
   --------------------------------------------------------------------------
   表の縦を「校時」から「時刻」に変えた（Googleカレンダー型）。時刻の正は
   ナギレンダーの `日付` の時刻そのもの（日課パターン方式は不採用）。
   ・開始: rec.time。無ければ 時限 から標準時程で仮置きし、推定（点線＋「時刻未登録」）にする
   ・終了: rec.endTime（`日付` の範囲の終わり）。無ければ時限から計算する
   ・時刻のない行事・出張・休み → 上の終日帯
   ・タスクは 標準時程の位置（DB_TASK の書き込み仕様は変えない）。空白のクリック・ドロップは近い校時へ
   ・表示は Day（表示日の1列）と Week（表示週の月〜金）。学校全体は校時グリッドのまま
   ========================================================================== */
var MAIN_AXIS = 'time';            /* 'time' | 'period'。'period' にすると Week が旧・校時マトリクスに戻る（Day は常に時間帯） */
var TL_FLOOR = [8 * 60, 17 * 60];  /* 自動伸縮の下限。予定の薄い週でも 8:00〜17:00 は必ず見せる */
var TL_PX_PER_MIN = 1.4;           /* 50分の授業 ≒ 70px。時刻＋名前2行が入る高さ */
var TL_MIN_H = 22;                 /* 短い予定でも名前1行は読める高さ(px) */
var TL_SHORT_MIN = 30;             /* これより短い箱は名前1行だけ */
var TL_COMPACT_MIN = 60;           /* Week でこれ以下の箱は概要を出さない（途中で切れた行を見せない） */
var PERIOD_GAP = 10;               /* 標準時程の校時間の休み（分）。短縮日課の終了の計算に使う */
var EVENT_DEFAULT_LEN = 50;        /* 終了時刻のない行事の仮の長さ（分） */
/* Day で「長い予定」とみなす長さ（分）と、それを寄せる左の帯の幅（%）。
   職場体験（1〜6校時）が列いっぱいに広がると、横にタスクを置く場所が見えない（2026-09-18 本人指摘） */
var TL_LONG_MIN = 120;
var TL_LONG_ZONE = 35;
var TL_ALLDAY_MAX = 2;             /* Week の終日帯に1日で見せる件数。超えた分は「＋N件」 */
var tlAllDayOpen = false;          /* 「＋N件」を押して全件開いているか（週をまたいで保つ） */

function hmToMin(hm) { var a = String(hm).split(':'); return (+a[0]) * 60 + (+a[1]); }
function minToHm(m) { m = Math.round(m); return Math.floor(m / 60) + ':' + ('0' + (m % 60)).slice(-2); }

/* 時刻（分）→ いちばん近い校時（1〜6）。空白クリック・ドロップの行き先に使う */
function nearestPeriod(m) {
  var best = 1, bestD = Infinity;
  PERIOD_MIN.forEach(function (s, i) {
    var d = m < s ? s - m : (m < s + PERIOD_LEN ? 0 : m - (s + PERIOD_LEN));
    if (d < bestD) { bestD = d; best = i + 1; }
  });
  return best;
}

/* コマ1件 → タイムラインに置く箱の配列（連続区間ごと）。純関数。
   Notion の `日付` は時刻を1つしか持てないので、非連続校時（4,6校時など）の2つ目以降は
   標準時程に置く（1つ目が標準時程と違う時刻＝短縮日課なら推定扱い） */
function lessonSpans(rec, c) {
  var t0 = rec.time ? hmToMin(rec.time) : null;
  var firstStd = c.runs.length ? PERIOD_MIN[c.runs[0].from - 1] : null;
  return c.runs.map(function (run, i) {
    var stdS = PERIOD_MIN[run.from - 1], stdE = PERIOD_MIN[run.to - 1] + PERIOD_LEN;
    if (i > 0 || t0 == null) {
      return { run: run, start: stdS, end: stdE, est: t0 == null || t0 !== firstStd };
    }
    var n = run.to - run.from + 1, e;
    if (rec.endTime && c.runs.length === 1) e = hmToMin(rec.endTime);   /* 範囲で登録された変則日 */
    else if (t0 === stdS) e = stdE;                                       /* 標準時程（昼休みもそのまま） */
    else e = t0 + n * PERIOD_LEN + (n - 1) * PERIOD_GAP;                  /* 短縮日課など: 長さから計算 */
    if (!(e > t0)) e = t0 + n * PERIOD_LEN;                               /* 範囲が逆転している入力ミス */
    return { run: run, start: t0, end: e, est: false };
  });
}

/* 日の配列＋コマ＋タスク → 日ごとの箱の配列 ＋ 終日帯。Day（1日）も Week（5日）もこれ1つ */
function timelineItems(days, schedule, tasks) {
  var perDay = days.map(function () { return []; });
  var allDay = days.map(function () { return []; });
  schedule.forEach(function (rec) {
    if (rec.excluded) return;                     /* 関係なし＝出さない（2026-09-09） */
    var di = days.indexOf(rec.date);
    if (di < 0) return;
    var c = classify(rec);
    if (c.hidden) return;
    if (c.runs.length) {                          /* 校時を持つもの（職場体験のような 行事＋1〜6校時 もここ） */
      lessonSpans(rec, c).forEach(function (sp) {
        perDay[di].push({ kind: 'lesson', rec: rec, run: sp.run, start: sp.start, end: sp.end, est: sp.est });
      });
      return;
    }
    var color = colorFor(rec, c);
    if (!color) return;
    if (!rec.time) { allDay[di].push({ rec: rec, color: color }); return; }
    var s = hmToMin(rec.time);
    var e = rec.endTime ? hmToMin(rec.endTime) : null;
    perDay[di].push({ kind: 'lesson', rec: rec, run: null, color: color, start: s,
                      end: (e > s) ? e : s + EVENT_DEFAULT_LEN, noEnd: !(e > s) });
  });
  (tasks || []).forEach(function (task) {
    var di = days.indexOf(task.date);
    if (di < 0 || !task.period) return;
    if (task.status === 'Done') return;           /* 完了したら時間割からは消す（2026-09-15） */
    var s = PERIOD_MIN[task.period - 1];
    perDay[di].push({ kind: 'task', task: task, start: s, end: s + PERIOD_LEN });
  });
  perDay.forEach(packColumns);
  return { perDay: perDay, allDay: allDay };
}

/* 重なりの並べ方（Googleカレンダーと同じ考え方。2026-09-18 に作り直し）。
   ・開始が TL_CASCADE_MIN 分以内の重なり（同じ校時の授業とタスク等）→ 横に並べる（列に割る）
   ・それより後から始まる重なり → 横に割らず、右へ字下げして上に重ねる（it.level）
   ★以前は重なりを全部横に割っていたので、職場体験（8:35〜15:20）が終わり際の 15:00 の会議と
     重なっただけで一日中半分の幅になり、14:30 の授業と 15:00 の会議も細い2列に割れて読めなかった
     （2026-09-18 本人指摘「週の予定で見にくい部分がある」）
   結果は it.x / it.w（0〜1。列の中の左端と幅）、it.cols（横に並んだ数）、it.level（重ねた段） */
var TL_CASCADE_MIN = 30;
var TL_INDENT = 0.22;      /* 1段重ねるごとの字下げ（列幅に対する割合） */
function packColumns(items) {
  var minLen = TL_MIN_H / TL_PX_PER_MIN;
  items.forEach(function (it) { it.visEnd = Math.max(it.end, it.start + minLen); });
  items.sort(function (a, b) {
    return a.start - b.start || (b.end - b.start) - (a.end - a.start) ||
           (a.kind === b.kind ? 0 : a.kind === 'lesson' ? -1 : 1);   /* 同じ時刻なら授業を左、タスクを右 */
  });
  function overlaps(a, b) { return a.start < b.visEnd && b.start < a.visEnd; }
  /* 1) 横に並べる組: 重なっていて、開始の差が TL_CASCADE_MIN 未満のもの同士 */
  var groups = [];
  items.forEach(function (it) {
    var g = groups.find(function (g) {
      return g.items.some(function (o) { return it.start - o.start < TL_CASCADE_MIN && overlaps(it, o); });
    });
    if (g) g.items.push(it); else groups.push({ start: it.start, items: [it] });
  });
  groups.forEach(function (g, gi) {
    g.end = Math.max.apply(null, g.items.map(function (it) { return it.visEnd; }));
    /* 2) 段: 先に始まっていて時間の重なる組より1段上（最大3段） */
    g.level = 0;
    groups.slice(0, gi).forEach(function (h) {
      if (h.start < g.end && g.start < h.end) g.level = Math.max(g.level, h.level + 1);
    });
    g.level = Math.min(g.level, 3);
    /* 3) 組の中で列に割る。右の列が空いている時間なら広げる（span） */
    var colEnds = [];
    g.items.forEach(function (it) {
      var col = colEnds.findIndex(function (e) { return e <= it.start; });
      if (col < 0) { col = colEnds.length; colEnds.push(it.visEnd); } else colEnds[col] = it.visEnd;
      it.col = col;
    });
    var n = colEnds.length, left = g.level * TL_INDENT, avail = 1 - left;
    g.items.forEach(function (it) {
      var span = 1;
      for (var c = it.col + 1; c < n; c++) {
        if (g.items.some(function (o) { return o.col === c && overlaps(o, it); })) break;
        span++;
      }
      it.cols = n;
      it.level = g.level;
      it.x = left + avail * it.col / n;
      it.w = avail * span / n;
    });
  });
}

/* Day 用の並べ直し。長い予定（TL_LONG_MIN 以上）は左の帯（TL_LONG_ZONE%）に寄せ、
   それと時間が重なる予定・タスクは右の残りに並べる。長い予定と重ならないものは全幅のまま。
   結果は it.zoneL / it.zoneW（%）に入れ、timelineBox がその中で col/cols/span を割る */
function layoutDayZones(items) {
  var longs = items.filter(function (it) { return it.kind === 'lesson' && it.end - it.start >= TL_LONG_MIN; });
  if (!longs.length) return;
  var others = items.filter(function (it) { return longs.indexOf(it) < 0; });
  packColumns(longs);
  packColumns(others);
  longs.forEach(function (it) { it.zoneL = 0; it.zoneW = TL_LONG_ZONE; });
  others.forEach(function (it) {
    var under = longs.some(function (l) { return l.start < it.visEnd && it.start < l.visEnd; });
    it.zoneL = under ? TL_LONG_ZONE : 0;
    it.zoneW = under ? 100 - TL_LONG_ZONE : 100;
  });
}

/* 表示レンジ（分）。中身の最早〜最遅を正時に丸め、下限 8:00〜17:00 は必ず含める */
function timelineRange(perDay) {
  var lo = TL_FLOOR[0], hi = TL_FLOOR[1];
  perDay.forEach(function (items) {
    items.forEach(function (it) { lo = Math.min(lo, it.start); hi = Math.max(hi, it.end); });
  });
  return [Math.floor(lo / 60) * 60, Math.ceil(hi / 60) * 60];
}

/* 箱1つ（授業・行事・タスク）。カードは校時グリッドと同じ lessonCard / taskCard を使うので、
   クリック編集・☐完了・ドラッグはそのまま効く */
function timelineBox(it, lo) {
  var box = el('div', 'tl-ev');
  var len = it.end - it.start;
  box.style.top = ((it.start - lo) * TL_PX_PER_MIN) + 'px';
  box.style.height = Math.max(len * TL_PX_PER_MIN, TL_MIN_H) + 'px';
  var zl = it.zoneL || 0, zw = it.zoneW || 100;      /* Day の左右の帯（layoutDayZones）。Week は全幅 */
  box.style.left = (zl + zw * it.x) + '%';
  box.style.width = (zw * it.w) + '%';
  if (it.level) { box.classList.add('is-nested'); box.style.zIndex = String(1 + it.level); }
  if (len < TL_SHORT_MIN) box.classList.add('is-short');
  if (len <= TL_COMPACT_MIN) box.classList.add('is-compact');
  var card;
  if (it.kind === 'task') {
    card = taskCard(it.task);
  } else {
    card = lessonCard(it.rec, it.run || { from: 0, to: 0 });
    if (it.color) card.dataset.color = it.color;
    if (it.est) box.classList.add('is-est');
    /* 時刻は名前の上に1行で（タスクは校時に置くだけで時刻を持たないので出さない） */
    var tm = el('div', 'tm', minToHm(it.start) + (it.noEnd ? '〜' : '〜' + minToHm(it.end)));
    if (it.est) tm.appendChild(el('span', 'est', '時刻未登録'));
    card.insertBefore(tm, card.firstChild);
    card.title = minToHm(it.start) + (it.noEnd ? '〜（終了未登録）' : '〜' + minToHm(it.end)) +
                 (it.est ? '（時刻未登録・標準時程で仮置き）' : '') + '\n' + card.title;
  }
  box.appendChild(card);
  return box;
}

/* --- タイムライン本体（PC）。Day は表示日の1列、Week は表示週の月〜金 --- */
function renderTimeline(view) {
  var g = $('#grid');
  g.textContent = '';
  g.className = 'grid tl tl-' + view;
  var wk = state.week;
  var today = resolveToday();
  var days, schedule;
  if (view === 'day') {
    days = [state.selectedDate];
    schedule = dayData(state.selectedDate).schedule;
  } else {
    days = wk ? wk.days : [0, 1, 2, 3, 4].map(function (i) { return addDays(state.weekStart || mondayOf(realToday()), i); });
    schedule = wk ? wk.schedule : [];
  }
  schedule = visibleSchedule(schedule);   /* 区分フィルタ（2026-09-18）。以降のこの関数の中は全部これを見る */
  var isTodayCol = function (day) { return day === today.date && (view === 'day' || today.inWeek); };
  /* タスクは全件（週外の日も出せるように）。GAS では allTasks、モックでは DUMMY_TASKS */
  var data = timelineItems(days, schedule, DUMMY_TASKS);
  if (view === 'day') data.perDay.forEach(layoutDayZones);
  var range = timelineRange(data.perDay);
  var lo = range[0], H = (range[1] - range[0]) * TL_PX_PER_MIN;
  var hasAllDay = data.allDay.some(function (a) { return a.length; });
  g.classList.toggle('no-allday', !hasAllDay);
  var bodyRow = hasAllDay ? '3' : '2';
  g.style.setProperty('--hour', (60 * TL_PX_PER_MIN) + 'px');

  /* 1行目: 日付ヘッダ（帯ドット付き） */
  g.appendChild(el('div', 'ph'));
  days.forEach(function (day, d) {
    var h = el('div', 'gh');
    h.style.gridColumn = String(d + 2);
    h.style.gridRow = '1';
    if (view === 'day') {
      h.appendChild(el('span', null, mdw(day)));
      if (day === today.date) h.appendChild(el('span', 'd', '今日'));
    } else {
      h.appendChild(el('span', null, DAY_LABELS[d]));
      h.appendChild(el('span', 'd', md(day)));
    }
    var kinds = [];
    schedule.forEach(function (rec) {
      if (rec.date !== day) return;
      var c = classify(rec);
      if (c.hidden) return;
      colorKeysFor(rec, c).forEach(function (k) { if (kinds.indexOf(k) < 0) kinds.push(k); });
    });
    if (kinds.length) {
      var dots = el('span', 'dots');
      kinds.forEach(function (k) { var i = el('i'); i.dataset.color = k; dots.appendChild(i); });
      h.appendChild(dots);
    }
    if (isTodayCol(day)) h.classList.add('is-today');
    g.appendChild(h);
  });

  /* 2行目: 終日帯（時刻のない行事・出張・休み・放課後）。行の見出しが「終日」なので、チップには時刻欄を出さない */
  if (hasAllDay) {
    var adh = el('div', 'tl-adh', '終日');
    adh.style.gridColumn = '1'; adh.style.gridRow = '2';
    g.appendChild(adh);
    data.allDay.forEach(function (list, d) {
      var cell = el('div', 'tl-ad');
      cell.style.gridColumn = String(d + 2); cell.style.gridRow = '2';
      if (isTodayCol(days[d])) cell.classList.add('is-today');
      var cap = (view === 'day' || tlAllDayOpen) ? list.length : TL_ALLDAY_MAX;
      if (list.length === cap + 1) cap++;          /* 「＋1件」のボタンで1行使うなら、そのまま出したほうが早い */
      list.slice(0, cap).forEach(function (x) {
        var ch = el('button', 'tl-adc');
        ch.type = 'button';
        ch.dataset.color = x.color;
        ch.dataset.lid = x.rec.id;                  /* クリックで編集フォーム（下の委任ハンドラ） */
        ch.textContent = x.rec.name;
        ch.title = x.rec.name + '（クリックで編集）';
        cell.appendChild(ch);
      });
      if (list.length > cap) {
        var more = el('button', 'tl-admore', '＋' + (list.length - cap) + '件');
        more.type = 'button';
        more.title = list.slice(cap).map(function (x) { return x.rec.name; }).join('\n');
        cell.appendChild(more);
      } else if (tlAllDayOpen && view === 'week' && list.length > TL_ALLDAY_MAX + 1) {
        var less = el('button', 'tl-admore', 'たたむ');
        less.type = 'button';
        cell.appendChild(less);
      }
      g.appendChild(cell);
    });
  }

  /* 3行目: 時刻軸＋各日の列 */
  var nowMin = jstNowMinutes();
  var axis = el('div', 'tl-axis');
  axis.style.gridColumn = '1'; axis.style.gridRow = bodyRow; axis.style.height = H + 'px';
  for (var m = lo; m < range[1]; m += 60) {
    var hr = el('span', 'hr', minToHm(m));
    hr.style.top = ((m - lo) * TL_PX_PER_MIN) + 'px';
    axis.appendChild(hr);
  }
  var anyToday = days.some(isTodayCol);
  PERIOD_MIN.forEach(function (pm, i) {
    var mk = el('span', 'pm', String(i + 1));
    mk.style.top = ((pm - lo) * TL_PX_PER_MIN) + 'px';
    mk.title = (i + 1) + '校時（標準 ' + PERIOD_START[i] + '〜）';
    if (anyToday && nowMin >= pm && nowMin < pm + PERIOD_LEN) mk.classList.add('is-now');
    axis.appendChild(mk);
  });
  g.appendChild(axis);

  var splitDays = {};
  data.perDay.forEach(function (items, d) {
    var col = el('div', 'tl-col');
    col.style.gridColumn = String(d + 2); col.style.gridRow = bodyRow; col.style.height = H + 'px';
    col.dataset.day = days[d];                    /* 空白クリック・ドロップの行き先 */
    col.dataset.lo = lo;
    col.title = 'クリックでタスクを割り当て（近い校時に置きます）';
    if (isTodayCol(days[d])) col.classList.add('is-today');
    items.forEach(function (it) {
      if (it.cols > 1) splitDays[d] = true;
      col.appendChild(timelineBox(it, lo));
    });
    if (isTodayCol(days[d]) && nowMin >= lo && nowMin <= range[1]) {
      var nl = el('div', 'tl-now');
      nl.style.top = ((nowMin - lo) * TL_PX_PER_MIN) + 'px';
      col.appendChild(nl);
    }
    g.appendChild(col);
  });
  /* Week で横に割れた日は列を広げる（校時グリッドの2列化と同じ理由。SPLIT_COL_FR） */
  g.style.gridTemplateColumns = view === 'day' ? '52px 1fr' : '52px ' + [0, 1, 2, 3, 4].map(function (i) {
    return (splitDays[i] ? SPLIT_COL_FR : 1) + 'fr';
  }).join(' ');

  /* 現在地の1行（時刻で判定。短縮日課の日も実際の時刻で「今／次」を出す） */
  var nlp = $('#nowline');
  nlp.textContent = '';
  var tdi = days.indexOf(today.date);
  if (tdi >= 0 && isTodayCol(today.date)) {
    var list = data.perDay[tdi].filter(function (it) { return it.kind === 'lesson'; });
    var cur = list.filter(function (it) { return it.start <= nowMin && nowMin < it.end; })[0];
    var nxt = list.filter(function (it) { return it.start > nowMin; })
                  .sort(function (a, b) { return a.start - b.start; })[0];
    var hit = cur || nxt;
    if (hit) {
      nlp.appendChild(el('span', null, (cur ? '今' : '次') + ':'));
      nlp.appendChild(el('b', null, hit.rec.name));
      nlp.appendChild(el('span', null, '（' + minToHm(hit.start) + (hit.noEnd ? '〜' : '〜' + minToHm(hit.end)) +
                                       (hit.est ? ' 目安' : '') + '）'));
    }
  }
  return days;
}

/* タイムラインの列の中の y 座標 → 分 */
function tlMinAt(col, clientY) {
  return +col.dataset.lo + (clientY - col.getBoundingClientRect().top) / TL_PX_PER_MIN;
}

/* 表のエリアの入口。state.gridMode が 'day' | 'week'（'school' は別の要素に描くのでここでは Week を描いておく） */

/* --- 校時マトリクス（PC）。3層明示配置。自動配置に任せない。
   2026-09-18 に Main は時間帯軸へ移行。MAIN_AXIS='period' のときだけ使う --- */
function renderPeriodGrid() {
  var g = $('#grid');
  g.textContent = '';
  g.className = 'grid';
  g.style.gridTemplateColumns = '';
  var wk = state.week;
  var today = resolveToday();
  var np = nowPeriodInfo();
  var schedule = wk ? visibleSchedule(wk.schedule) : [];   /* 区分フィルタ（2026-09-18） */

  /* 曜日ごとの帯ドット（行事藍・出張橙茶・休み臙脂・放課後紫） */
  var dayDots = [[], [], [], [], []];
  if (wk) schedule.forEach(function (rec) {
    var c = classify(rec);
    if (c.hidden) return;
    var di = wk.days.indexOf(rec.date);
    if (di < 0) return;
    colorKeysFor(rec, c).forEach(function (k) {
      if (dayDots[di].indexOf(k) < 0) dayDots[di].push(k);
    });
  });

  /* 1層目: ヘッダ */
  g.appendChild(el('div', 'ph'));  /* 左上空セル */
  for (var d = 0; d < 5; d++) {
    var h = el('div', 'gh');
    h.style.gridColumn = String(d + 2);
    h.style.gridRow = '1';
    var lab = el('span', null, DAY_LABELS[d]);
    var dd = el('span', 'd', wk ? md(wk.days[d]) : '');
    h.appendChild(lab); h.appendChild(dd);
    if (dayDots[d].length) {
      var dots = el('span', 'dots');
      dayDots[d].forEach(function (k) {
        var i = el('i'); i.dataset.color = k; dots.appendChild(i);
      });
      h.appendChild(dots);
    }
    if (wk && wk.days[d] === today.date && today.inWeek) h.classList.add('is-today');
    g.appendChild(h);
  }

  /* 校時ヘッダ（左列） */
  for (var p = 1; p <= 6; p++) {
    var ph = el('div', 'ph');
    ph.style.gridColumn = '1';
    ph.style.gridRow = String(p + 1);
    ph.appendChild(el('span', null, String(p)));
    ph.appendChild(Object.assign(el('small'), { textContent: PERIOD_START[p - 1] }));
    if (np && np.now === p && today.inWeek) ph.classList.add('is-now');   /* 今日がこの週にある時だけ */
    g.appendChild(ph);
  }

  /* 2層目: 空きスロット30個（無地・＋はホバー時のみ） */
  for (var d2 = 0; d2 < 5; d2++) {
    for (var p2 = 1; p2 <= 6; p2++) {
      var s = el('div', 'slot');
      s.style.gridColumn = String(d2 + 2);
      s.style.gridRow = String(p2 + 1);
      s.title = '空きコマ（クリックでタスクを割り当て）';
      s.tabIndex = 0;
      s.setAttribute('role', 'button');
      s.setAttribute('aria-label', DAY_LABELS[d2] + '曜 ' + p2 + '校時 空きコマ');
      s.dataset.di = d2;
      s.dataset.p = p2;
      if (wk && wk.days[d2] === today.date && today.inWeek) s.classList.add('is-today');
      g.appendChild(s);
    }
  }

  var splitDays = {};   /* di → true（2列にした日。列幅を広げるのに使う） */

  /* 3層目: 授業カード＋タスクカード。
     ★2026-09-18 に「その日の中で2列」へ作り替えた。
     それまでは 配置キー(col × from-to) ごとに cellbox を作って縦積みしていたので、
     職場体験のような 1〜6校時にまたがる行事と、3校時のタスクのように **範囲が違う重なり**
     が起きると、2つの cellbox が同じマスに重なって描かれて読めなくなっていた。
     いまは日（列）ごとに中身を集め、重なりがあればその日だけを左右2レーンに割る:
       ・レーン0（左）＝先に置けたもの。またぎ行事はここに通しで入る
       ・レーン1（右）＝レーン0と範囲が重なるもの。校時ごとの枠になる
       ・レーン1にも重なる3つ目以降は、レーン1の同じ枠に縦積み（従来の逃し方）
       ・重なりが1つも無い日は従来どおり全幅（見た目を変えない）
     さらに、左に またぎ行事 がある校時で右が空いているときは **空の受け皿** を置く。
     これが無いと、行事に覆われた校時の ＋ が押せず「職場体験の空き時間にタスクを置く」が
     できない（＝本人要望の入口）。 */
  if (wk) {
    var boxes = {};   /* key "col:lane:from:to" → cellbox */
    function boxFor(col, lane, from, to, isToday, open) {
      var key = col + ':' + lane + ':' + from + ':' + to;
      if (!boxes[key]) {
        var b = el('div', 'cellbox');
        b.style.gridColumn = String(col);
        b.style.gridRow = (from + 1) + ' / ' + (to + 2);
        b.dataset.di = col - 2;            /* ドロップ先の解決に使う */
        b.dataset.p = from;
        if (isToday) b.classList.add('is-today');
        if (lane >= 0) b.classList.add(lane === 0 ? 'lane-l' : 'lane-r');
        if (open) {
          b.classList.add('open');         /* 空の受け皿（またぎ行事の横） */
          b.tabIndex = 0;
          b.setAttribute('role', 'button');
          b.setAttribute('aria-label', DAY_LABELS[col - 2] + '曜 ' + from + '校時 タスクを割り当て');
          b.title = from + '校時にタスクを割り当て';
        }
        g.appendChild(b);
        boxes[key] = b;
      }
      return boxes[key];
    }

    /* 日ごとに「置きたいもの」を集める。lesson は run 単位、task は1校時 */
    var perDay = [[], [], [], [], []];
    schedule.forEach(function (rec) {
      if (rec.excluded) return;   /* 関係なし＝週グリッドには出さない（2026-09-09） */
      var c = classify(rec);
      if (c.hidden || !c.runs.length) return;
      var di = wk.days.indexOf(rec.date);
      if (di < 0) return;
      c.runs.forEach(function (run) {
        perDay[di].push({ kind: 'lesson', rec: rec, run: run, from: run.from, to: run.to });
      });
    });
    (wk.tasks || []).forEach(function (task) {
      var di = wk.days.indexOf(task.date);
      if (di < 0 || !task.period) return;
      if (task.status === 'Done') return;   /* 完了したら時間割からは消す（右の欄の「完了」に残る。2026-09-15） */
      perDay[di].push({ kind: 'task', task: task, from: task.period, to: task.period });
    });

    perDay.forEach(function (items, di) {
      if (!items.length) return;
      var isToday = wk.days[di] === today.date && today.inWeek;
      /* またぎ（範囲の広いもの）を先に左へ。同じ幅なら早い校時から */
      items.sort(function (a, b) { return (b.to - b.from) - (a.to - a.from) || (a.from - b.from); });
      var lanes = [[], []];
      function hits(list, it) {
        return list.some(function (x) { return it.from <= x.to && x.from <= it.to; });
      }
      items.forEach(function (it) {
        it.lane = hits(lanes[0], it) ? 1 : 0;
        lanes[it.lane].push(it);
      });
      var split = lanes[1].length > 0;          /* 重なりが無い日は全幅のまま */
      if (split) splitDays[di] = true;
      items.forEach(function (it) {
        var box = boxFor(di + 2, split ? it.lane : -1, it.from, it.to, isToday, false);
        box.appendChild(it.kind === 'lesson' ? lessonCard(it.rec, it.run) : taskCard(it.task));
      });
      if (!split) return;
      /* 左のまたぎ行事に覆われた校時で、右が空いているところに受け皿を作る */
      lanes[0].forEach(function (it) {
        if (it.to === it.from) return;          /* またいでいないコマは校時が1つ＝右も同じ枠でよい */
        for (var p3 = it.from; p3 <= it.to; p3++) {
          var covered = lanes[1].some(function (x) { return p3 >= x.from && p3 <= x.to; });
          if (!covered) boxFor(di + 2, 1, p3, p3, isToday, true);
        }
      });
    });
    /* 2列にした日だけ列を広げる（半分になっても字が読める幅を確保する）。
       全部の日が1fr のままだと半分＝約72px で日本語が1〜2文字ずつ折り返す */
    g.style.gridTemplateColumns = '52px ' + [0,1,2,3,4].map(function (i) {
      return (splitDays[i] ? SPLIT_COL_FR : 1) + 'fr';
    }).join(' ');
  }

  /* 現在地マーカー行 */
  var nl = $('#nowline');
  nl.textContent = '';
  if (np && wk && today.inWeek) {          /* 今日がこの週にある時だけ「今／次」を出す */
    var target = np.now || np.next;
    if (target) {
      var verb = np.now ? '今' : '次';
      var hit = null;
      schedule.some(function (rec) {
        if (rec.date !== today.date) return false;
        var c = classify(rec);
        return c.runs.some(function (r) {
          if (target >= r.from && target <= r.to) { hit = rec; return true; }
          return false;
        });
      });
      nl.innerHTML = '';
      nl.appendChild(el('span', null, verb + ': ' + target + '校時'));
      var b = el('b', null, hit ? ' ' + hit.name : ' 空きコマ');
      nl.appendChild(b);
      nl.appendChild(el('span', null, '（' + PERIOD_START[target - 1] + '〜 目安）'));
    }
  }

}

/* グリッド下の注記（校時マトリクス・時間帯軸で共通） */
function renderGridNotes(days) {
  /* 表示日と表示週の関係（2026-09-18。週と日付が独立したので、ずれることがある） */
  renderWeekNote();

  /* 「関係なし」で週グリッドから外した授業の再編集導線（2026-09-09）。
     非表示にしただけで戻せなくならないよう、ここから編集フォームを開き直せるようにする */
  var enWrap = $('#excludednote');
  if (enWrap) {
    enWrap.textContent = '';
    var seen = {}, excludedList = [];   /* 表に出している日（Day なら1日）の分だけ。週外キャッシュも見る */
    allSchedules().forEach(function (list) {
      list.forEach(function (rec) {
        if (rec.excluded && days.indexOf(rec.date) >= 0 && !seen[rec.id]) { seen[rec.id] = true; excludedList.push(rec); }

    });
    if (excludedList.length) {
      enWrap.appendChild(document.createTextNode('関係なしにして表から外した授業: '));

        b.type = 'button';
        b.addEventListener('click', function (e) { openLessonEditor({ rec: rec }, e.clientX, e.clientY); });

  }
}

function lessonCard(rec, run) {
  var c = el('div', 'lesson');
  c.dataset.grade = rec.grade || '';
  c.dataset.lid = rec.id;                 /* クリック編集・ドラッグ移動で使う */
  c.tabIndex = 0;
  c.setAttribute('role', 'button');
  c.setAttribute('aria-label', rec.name + ' を編集');
  c.dataset.runFrom = run.from;
  c.dataset.runTo = run.to;
  var nm = el('div', 'nm', rec.name);
  if (run.to > run.from) nm.appendChild(el('span', 'span-badge', run.from + '〜' + run.to + '校時'));
  if (rec.grade) nm.appendChild(el('span', 'grade-chip', rec.grade));
  c.appendChild(nm);
  /* カードに出すのは概要だけ（2026-09-09 本人要望で 詳細メモへのフォールバックを廃止）。
     詳細メモ・フィードバックはツールチップでのみ見せる */
  var subTxt = [(rec.place || []).join('・'), rec.summary].filter(Boolean).join(' — ');
  if (subTxt) {
    /* 場所と概要を別 span にしておく（Week の狭い箱では CSS で場所だけ隠して概要を残す） */
    var sub = el('div', 'sub');
    var pl = (rec.place || []).join('・');
    if (pl) sub.appendChild(el('span', 'pl', pl + (rec.summary ? ' — ' : '')));
    if (rec.summary) { sub.appendChild(el('span', 'sm', rec.summary)); c.classList.add('has-sum'); }
    c.appendChild(sub);
  }
  var sl = sciLinkBtn(rec);
  if (sl) c.appendChild(sl);
  var tip = [rec.name, subTxt,
             rec.memo || '',
             rec.feedback ? '振り返り: ' + rec.feedback : ''].filter(Boolean).join('\n');
  c.title = tip;
  return c;
}
var CARD_STATUS = { 'Done': '✔ 済', 'In Progress': '▶ 進行中', '中断': '⏸ 中断' };
function taskCard(task) {
  var c = el('div', 'taskcard');
  c.dataset.tid = task.id;               /* グリッド上のドラッグ移動で使う */
  if (task.status === 'Done') c.classList.add('is-done');
  else if (task.status === 'In Progress') c.classList.add('is-doing');
  else if (task.status === '中断') c.classList.add('is-paused');

  /* ☐ → その場で完了（タスク行のチェックと同じ finishTask）。完了済みなら未完了に戻す */
  var ck = el('button', 'ck', task.status === 'Done' ? '✔' : '');
  ck.type = 'button';
  ck.title = task.status === 'Done' ? '未完了に戻す' : '完了にする';
  ck.setAttribute('aria-label', (task.status === 'Done' ? '未完了に戻す: ' : '完了: ') + task.name);
  ck.addEventListener('click', function (e) { e.stopPropagation(); toggleGridTask(task); });
  c.appendChild(ck);

  var bd = el('div', 'bd');
  bd.appendChild(el('div', 'nm', task.name));
  var sl = CARD_STATUS[task.status];
  if (sl) bd.appendChild(el('div', 'st', sl));
  c.appendChild(bd);
  c.title = task.name;
  return c;
}
/* グリッド上の写し（state.week.tasks）ではなく DUMMY_TASKS 側の本体を更新する（実績・セッションも確定） */
function toggleGridTask(card) {
  var t = DUMMY_TASKS.find(function (x) { return x.id === card.id; }) || card;
  if (t.status === 'Done') {
    var snap = taskSnap(t);
    t.status = 'Not Started';                        /* spentMin は消さない（タスク行と同じ） */
    syncWeekTask(t);
    Store.updateTask(t.id, { status: 'Not Started' });
    rerenderTasks();
    showToast('「' + t.name + '」を未完了に戻しました', function () { restoreTask(t, snap); });
  } else {
    finishTask(t);
  }
}

/* --- 土日帯: 表示週の金曜の直後の土日。実日付が「直前の土日」なら（土日は翌週に丸めるため）
       その日も先頭に出す。表（グリッド）は月〜金のまま --- */
function renderWeekend(pane) {
  var wrap = $('.js-band-weekend', pane);

  wrap.textContent = '';
  var wk = state.week;
  if (!wk) return;
  var real = realToday();
  var schedule = visibleSchedule(wk.schedule);   /* 区分フィルタ（2026-09-18） */
  var days = (wk.weekend || []).slice();
  if ((wk.prevWeekend || []).indexOf(real) >= 0) days = wk.prevWeekend.concat(days);
  days.forEach(function (d) {
    var row = el('div', 'wd');
    if (d === real) row.classList.add('is-today');

    else row.appendChild(el('span', 'empty', state.loading ? '読み込み中…' : '予定なし'));

}

/* --- クイックリンク: Notion「クイックリンク」DB（週 payload 同梱、サーバーで10分キャッシュ） --- */
function renderLinks(pane) {
  var wrap = $('.js-links', pane);
  if (!wrap) return;
  wrap.textContent = '';
  var L = state.week && state.week.links;
  if (!L) { wrap.appendChild(el('span', 'empty', state.loading ? '読み込み中…' : '—')); return; }

    wrap.appendChild(el('span', 'empty', 'クイックリンク DB を読めません（Notion 側でインテグレーションの接続を確認）: ' + L.error));
    return;
  }
  var items = (L.items || []).slice().sort(function (a, b) {
    var ao = a.order == null ? 1e9 : a.order, bo = b.order == null ? 1e9 : b.order;

  ed.appendChild(el('span', null, '＋ 編集'));
  wrap.appendChild(ed);
}

/* --- 帯。pane スコープで描く（PC=今日固定 / SP=選択日） --- */
function renderBands(pane, date) {

  var evBand = $('.js-band-events', pane);

  afBand.textContent = '';

    return ch;
  }
  var noneEv = dd.error ? ('この日を読めません: ' + dd.error) : (dd.loading ? '読み込み中…' : '行事・出張はありません');
  var noneAf = dd.error ? '—' : (dd.loading ? '読み込み中…' : '放課後の予定はありません');
  if (evItems.length) evItems.forEach(function (i) { evBand.appendChild(chip(i)); });
  else evBand.appendChild(el('span', 'empty', noneEv));
  if (afItems.length) afItems.forEach(function (i) { afBand.appendChild(chip(i)); });
  else afBand.appendChild(el('span', 'empty', noneAf));

  var title = $('.js-band-title', pane);
  if (title) {
    title.textContent = (date === resolveToday().date)
      ? '今日の行事・出張' : mdw(date) + ' の行事・出張';
  }
}

/* --- 日直・連絡・給食の帯（グリッドの上）。pane スコープ --- */
function renderDayStrip(pane, date) {
  var strip = $('.js-daystrip', pane);
  strip.textContent = '';
  var dd = dayData(date);
  var j = dd.journal;
  [['日直', j && j.nichoku, 'bell'], ['連絡', j && j.renraku, 'letter'], ['給食', j && j.kyushoku, 'plate']].forEach(function (pair) {
    var d = el('div', 'ds');
    d.appendChild(iconSpan(pair[2]));
    d.appendChild(el('b', null, pair[0]));
    d.appendChild(el('span', pair[1] ? null : 'none', pair[1] || (dd.loading ? '…' : '—')));
    if (pair[1]) d.title = pair[0] + '：' + pair[1];   /* 2行に収まらない分はホバーで読む */
    strip.appendChild(d);
  });
}

function iconSpan(name) {
  var s = el('span', 'hicon');
  if (ICONS[name]) s.innerHTML = ICONS[name];
  return s;
}
/* 静的な見出し(h2[data-icon])にアイコンを差す。起動時に1回。
   何度呼ばれても増えないよう、既存の差し込み分を消してから入れる（冪等） */
function injectIcons() {
  $all('[data-icon]').forEach(function (h) {
    $all('.hicon', h).forEach(function (old) { old.parentNode.removeChild(old); });
    h.insertBefore(iconSpan(h.dataset.icon), h.firstChild);
  });
}

var KIND_LABEL = {
  '▶次に取るべき行動リスト': { label: '▶次の行動', k: 'next' },
  '💡いつかやる・たぶんやる': { label: '💡いつか', k: 'someday' },
  '☎連絡待ち':               { label: '☎連絡待ち', k: 'waiting' },
  '📃資料':                   { label: '📃資料', k: 'doc' },
  '🗑ゴミ箱':                 { label: '🗑ゴミ箱', k: 'trash' }
};
function isOpen(t) { return t.status !== 'Done'; }
/* 書き込み・判定用の「本当の今日」。表示週に引きずられない（レビュー指摘: 週送り後の
   「すべて今日へ」が来週月曜に飛ぶ事故を防ぐ）。表示用の週外フォールバックは resolveToday() */
function realToday() { return MOCK_TODAY || jstTodayString(); }
function todayStr() { return realToday(); }
/* 実施予定日の付け替え（今日へ・今日・明日・📅）。日付のみで書くので、
   もし校時割り当ての時刻が付いていた場合は消える（README §10 で割り切り済み） */
function setTaskDate(t, d) {
  var snap = taskSnap(t);
  t.date = d;
  if (t.period) t.period = null;        /* 日付のみで書くのでコマ割り当ての時刻は消える */
  syncWeekTask(t);
  Store.updateTask(t.id, { date: d });
  rerenderTasks();
  showToast('「' + t.name + '」を' + (d ? mdw(d) : '日付なし') + 'に移しました' + (snap.period ? '（コマは外れました）' : ''),
            function () { restoreTask(t, snap); });
}
function rerenderTasks() {
  var mode = $('#shell').dataset.mode;
  if (mode === 'today') renderTodayTab();     /* Setup の中のタスク管理（2026-09-29） */
  else refresh();
}

/* ---- 時間記録（GTDエージェントのフィードバック元データ。正確さ優先） ----
   実績 = 累積実績(spentMin) ＋ 進行中セッションの経過分。
   ▶開始/▶再開 → startedAt に現在時刻 / ⏸中断・✅完了 → 経過分を spentMin に確定 */
var SESSION_CAP_MIN = 720;   /* 1セッションの上限12h（止め忘れで化け物にならないように） */
function sessionElapsed(t) {
  if (t.status !== 'In Progress' || !t.startedAt) return 0;
  return Math.min(SESSION_CAP_MIN, Math.max(0, Math.floor((Date.now() - t.startedAt) / 60000)));
}
function spentOf(t) { return (t.spentMin || 0) + sessionElapsed(t); }
/* ms → Notion に書く ISO（JST, +09:00） */
function jstIso(ms) {
  var d = new Date(ms);
  var parts = new Intl.DateTimeFormat('sv-SE', { timeZone: 'Asia/Tokyo', year: 'numeric', month: '2-digit', day: '2-digit',
    hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false }).format(d);   /* "YYYY-MM-DD HH:mm:ss" */
  return parts.replace(' ', 'T') + '+09:00';
}
function fmtMin(m) {
  if (m < 60) return m + '分';
  return (m % 60 === 0) ? (m / 60) + 'h' : Math.floor(m / 60) + 'h' + (m % 60) + '分';
}
function settleSession(t) {   /* 進行中の経過を累積に確定する */
  if (t.status === 'In Progress' && t.startedAt) {
    t.spentMin = (t.spentMin || 0) + Math.max(1, sessionElapsed(t));
  }
  t.startedAt = null;
}
/* ▶開始: セッション開始（Notion の専用列）に今を書く。⏸中断・✅完了: 経過を累積に足して列を空にする。
   Notion 側の 開始日時/終了日時 は触らない（README §5） */
function startTask(t)  { t.status = 'In Progress'; t.startedAt = Date.now(); syncWeekTask(t);
                         Store.updateTask(t.id, { status: 'In Progress', sessionStart: jstIso(t.startedAt) }); rerenderTasks(); }
function pauseTask(t)  { settleSession(t); t.status = '中断'; syncWeekTask(t);
                         Store.updateTask(t.id, { status: '中断', spentMin: t.spentMin || 0, sessionStart: null }); rerenderTasks(); }
function finishTask(t) { var snap = taskSnap(t); settleSession(t); t.status = 'Done'; syncWeekTask(t);
                         Store.updateTask(t.id, { status: 'Done', spentMin: t.spentMin || 0, sessionStart: null }); rerenderTasks();
                         showToast('「' + t.name + '」を完了にしました', function () { restoreTask(t, snap); }); }

/* ==== 取り消し（Undo）: 直前のタスク状態を控えておき、トーストから戻す ==== */
function taskSnap(t) {
  return { status: t.status, date: t.date, period: t.period, kind: t.kind, spentMin: t.spentMin || 0, startedAt: t.startedAt || null };
}
function taskDateValue(t) {   /* Notion に書く 実施予定日 の値 */
  if (!t.date) return null;
  return t.period ? t.date + 'T' + periodTimeStr(t.period) + ':00+09:00' : t.date;
}
function syncWeekTask(t) {    /* 週グリッド用の写しを合わせる（既存はその場で更新。コマ内の順序を保つ） */
  if (!state.week) return;
  var list = state.week.tasks || [];
  var i = -1;
  list.some(function (x, k) { if (x.id === t.id) { i = k; return true; } return false; });
  if (t.date && t.period) {
    var rec = { id: t.id, name: t.name, date: t.date, period: t.period, status: t.status };
    if (i >= 0) list[i] = rec; else list.push(rec);
  } else if (i >= 0) {
    list.splice(i, 1);
  }
  state.week.tasks = list;
}
function restoreTask(t, snap) {
  t.status = snap.status; t.date = snap.date; t.period = snap.period; t.kind = snap.kind;
  t.spentMin = snap.spentMin; t.startedAt = snap.startedAt;
  syncWeekTask(t);
  Store.updateTask(t.id, { status: t.status, date: taskDateValue(t), kind: t.kind, spentMin: t.spentMin,
                           sessionStart: t.startedAt ? jstIso(t.startedAt) : null });
  rerenderTasks();
}

/* ---- トースト（1つだけ。7秒で消える） ---- */
var toastEl = null, toastTimer = null;
function hideToast() {
  if (toastEl && toastEl.parentNode) toastEl.parentNode.removeChild(toastEl);
  toastEl = null;
  clearTimeout(toastTimer);
}
function showToast(msg, undoFn) {
  hideToast();
  var t = el('div', 'toast');
  t.setAttribute('role', 'status');
  t.appendChild(el('span', null, msg));
  if (undoFn) {
    var b = el('button', null, '元に戻す');
    b.addEventListener('click', function () { hideToast(); undoFn(); });
    t.appendChild(b);
  }
  document.body.appendChild(t);
  toastEl = t;
  toastTimer = setTimeout(hideToast, 7000);
}

/* 1分ごと: 進行中の経過表示と現在地マーカーを更新。ドラッグ中・ピッカー/フォームを開いている間・
   Docs タブ（検索語が消える）では触らない */
setInterval(function () {
  if (pickerEl || document.querySelector('.dragging, .drag-card')) return;
  if (state.mode === 'often' || state.mode === 'science' || state.loading) return;
  /* 入力途中のタスク名を描き直しで消さない（2026-09-15） */
  if ($all('.quickadd input').some(function (i) { return i.value || i === document.activeElement; })) return;
  var running = DUMMY_TASKS.some(function (t) { return t.status === 'In Progress'; });
  if (state.mode === 'week' || running) rerenderTasks();
}, 60000);

/* opts: { assign:true INBOX用の「今日/明日」ボタン, adjust:true 積み残し用の「今日へ」,
          kind:true 種別セレクタ表示 } */
function taskItem(task, opts) {
  opts = opts || {};
  var row = el('div', 'titem');
  row.dataset.tid = task.id;
  if (task.status === 'Done') row.classList.add('done');
  if (task.status === 'In Progress') row.classList.add('doing');
  if (task.status === '中断') row.classList.add('paused');

  if (opts.sortable) {                                /* ドラッグで並び替え */
    var dh = el('span', 'drag', '⠿');
    dh.title = 'ドラッグで並び替え';
    row.appendChild(dh);
  }

  var cb = document.createElement('input');           /* ✅完了 相当（実績を確定して Done） */
  cb.type = 'checkbox';
  cb.checked = task.status === 'Done';
  cb.title = '完了にする（✅完了）';
  cb.setAttribute('aria-label', '完了: ' + task.name);
  cb.addEventListener('change', function () {
    if (cb.checked) finishTask(task);
    else { task.status = 'Not Started';                      /* spentMin は消さない */
           Store.updateTask(task.id, { status: 'Not Started' }); rerenderTasks(); }
  });
  row.appendChild(cb);

  row.appendChild(el('span', 'tn', task.name));

  /* 種別セレクタ（どのビューでも変更できる。本人要望 2026-09-04）＋プロジェクト名チップ */
  {
    var sel = document.createElement('select');
    sel.className = 'ksel';
    [['', '未分類'],
     ['▶次に取るべき行動リスト', '▶次の行動'],
     ['☎連絡待ち', '☎連絡待ち'],
     ['💡いつかやる・たぶんやる', '💡いつか'],
     ['📃資料', '📃資料'],
     ['🗑ゴミ箱', '🗑ゴミ箱']].forEach(function (o) {
      var op = document.createElement('option');
      op.value = o[0]; op.textContent = o[1];
      sel.appendChild(op);
    });
    sel.value = task.kind || '';
    var ki0 = KIND_LABEL[task.kind];

/* 手動並び順。ドラッグ確定時に order(連番) を振り直す。
   未設定(order=null)は末尾扱い、同順位は status 順で崩れないようにする。
   ★Phase 2: Notion 側に number「並び順」を追加してここに書き戻す */
function bySort(a, b) {
  var ao = a.order != null ? a.order : 1e9;
  var bo = b.order != null ? b.order : 1e9;
  if (ao !== bo) return ao - bo;
  var order = { 'In Progress': 0, '中断': 1, 'Not Started': 2, 'Done': 3 };
  var sa = order[a.status] != null ? order[a.status] : 9;
  var sb = order[b.status] != null ? order[b.status] : 9;
  return sa - sb;
}

/* 並び替えは【document への委任1本】で処理する（2026-08-31 変更）。
   GAS 実機で「モックでは動くのにドラッグだけ効かない」事象があり、要素に
   付けたリスナーはコンテナの差し替えで死ぬため、差し替わらない document に
   一度だけ付ける。⠿ を掴んだ行の親 .tasklist がその場で対象になる */
function enableSort(list) { /* 委任化により登録は不要。呼び出し互換のため残す */ }
document.addEventListener('pointerdown', function (e) {
    var h = e.target.closest('.drag');
    if (!h) return;
    var list = h.closest('.tasklist');
    if (!list) return;
    var row = h.closest('.titem');
    e.preventDefault();
    try { h.setPointerCapture(e.pointerId); } catch (err) {}

    /* つかんだ行は transform で指に追従させ、DOM の入れ替えは
       裏で行う。ずれた分は grabY を補正して見た目を切らさない。
       他の行は FLIP（移動前後の差分から逆向き transform → 0 へ遷移）で滑らせる */
    var grabY = e.clientY;
    row.classList.add('dragging');

    function siblings() {
      return Array.prototype.slice.call(list.querySelectorAll('.titem')).filter(function (r) { return r !== row; });
    }

    function moveWithFlip(next) {
      var others = siblings();
      var before = others.map(function (r) { return r.getBoundingClientRect().top; });
      var rowTopBefore = row.offsetTop;
      if (next) list.insertBefore(row, next);
      else list.appendChild(row);
      grabY += row.offsetTop - rowTopBefore;      /* 追従位置を維持 */
      others.forEach(function (r, i) {
        var d = before[i] - r.getBoundingClientRect().top;
        if (!d) return;
        r.style.transition = 'none';
        r.style.transform = 'translateY(' + d + 'px)';
        requestAnimationFrame(function () {
          r.style.transition = 'transform .18s ease';
          r.style.transform = '';
        });
      });
    }

    function onMove(ev) {
      row.style.transform = 'translateY(' + (ev.clientY - grabY) + 'px) scale(1.015)';
      var rows = siblings();
      var next = null;
      for (var i = 0; i < rows.length; i++) {
        var rc = rows[i].getBoundingClientRect();
        if (ev.clientY < rc.top + rc.height / 2) { next = rows[i]; break; }
      }
      if (next !== row.nextElementSibling || (!next && row !== list.lastElementChild)) {
        if (!(next === null && row === list.lastElementChild)) moveWithFlip(next);
      }
    }

    function finalize() {
      siblings().forEach(function (r) { r.style.transition = ''; r.style.transform = ''; });
      var changed = [];
      /* タスク管理の TODAY は種別ごとに .tasklist が分かれるので、列全体で通し番号にする */
      var scope = list.closest('.adjust-cols > div') || list;
      Array.prototype.forEach.call(scope.querySelectorAll('.titem'), function (r, idx) {
        var t = DUMMY_TASKS.find(function (x) { return x.id === r.dataset.tid; });
        if (t && t.order !== idx) { t.order = idx; changed.push({ id: t.id, order: idx }); }
      });
      if (changed.length) Store.updateOrders(changed);
      rerenderTasks();
    }

    function onUp() {
      document.removeEventListener('pointermove', onMove);
      document.removeEventListener('pointerup', onUp);
      document.removeEventListener('pointercancel', onUp);
      /* 着地アニメーション: 今いる場所へふわっと収めてから確定する */
      row.style.transition = 'transform .16s ease';
      row.style.transform = 'translateY(0) scale(1)';
      var done = false;
      function settle() {
        if (done) return;
        done = true;
        row.classList.remove('dragging');
        row.style.transition = '';
        row.style.transform = '';
        finalize();
      }
      row.addEventListener('transitionend', settle, { once: true });
      setTimeout(settle, 220);                     /* transitionend が来ない環境の保険 */
    }

    document.addEventListener('pointermove', onMove);
    document.addEventListener('pointerup', onUp);
    document.addEventListener('pointercancel', onUp);
});

  /* やる（並び替え可）→ 連絡待ち → 完了 の3段に分ける（本人要望 2026-09-01:
     完了したものがその場に残らない・連絡待ちが混ざらない）。
     並び替えのドラッグは内側の .tasklist 単位で閉じるので、段をまたいで動かない */
  if (state.loading) { wrap.appendChild(el('div', 'empty', '読み込み中…')); return; }

  wrap.appendChild(quickAddForm('タスクを追加（Enter）', function (name) { createNewTask(name, date, null); }));
  var all = DUMMY_TASKS.filter(function (t) { return t.date === date && t.kind !== '🗑ゴミ箱'; });
  var doing = all.filter(function (t) { return isOpen(t) && t.kind !== '☎連絡待ち'; });
  var waiting = all.filter(function (t) { return isOpen(t) && t.kind === '☎連絡待ち'; });
  var done = all.filter(function (t) { return !isOpen(t); });
  doing.sort(bySort); waiting.sort(bySort);
  if (!all.length) wrap.appendChild(el('div', 'empty', 'タスクはありません'));
  var doingList = el('div', 'tasklist');
  doing.forEach(function (t) { doingList.appendChild(taskItem(t, { sortable: true })); });
  if (doing.length) wrap.appendChild(doingList);

    var wl = el('div', 'tasklist');

  var title = $('.js-tasks-title', pane);

  }

/* 種別ごとのサブグループに分けた1カラム（タスク管理ビューの TODAY / INBOX 用）

var KIND_ORDER = [null, '▶次に取るべき行動リスト', '☎連絡待ち', '💡いつかやる・たぶんやる', '📃資料'];

/* input[type=time] の value は時も2桁の HH:MM でないと黙って空になる（起案書アプリで踏んだ罠）。
   サーバーは 'H:mm' で返してくるのでここで詰める */
function hhmm2(t) {
  if (!t) return '';
  var a = String(t).split(':');
  return ('0' + a[0]).slice(-2) + ':' + ('0' + a[1]).slice(-2);
}

/* タスクの3ビュー（TODAY／タスク管理／すべて）を root に描く。Setup から使う（2026-09-29。Tasks タブは 2026-10-02 に廃止して Science に置き換えた） */
function buildTaskView(root, view) {
  var td = todayStr();
  if (state.loading) { root.appendChild(el('div', 'stateband', '読み込み中…')); return; }
  if (state.error) { root.appendChild(el('div', 'stateband', 'タスクを取得できませんでした。週タブの「再読み込み」を押してください')); return; }

  if (view === 'today') {
    var od = overdueTasks();
    if (od.length) {
      var bulk = el('button', 'bulk', 'すべて今日へ');
      bulk.addEventListener('click', function () {
        if (!confirm('積み残し ' + od.length + ' 件の実施予定日を今日（' + mdw(td) + '）に移しますか？')) return;
        var snaps = od.map(function (t) { return { t: t, snap: taskSnap(t) }; });
        od.forEach(function (t) { t.date = td; if (t.period) t.period = null; syncWeekTask(t); });
        Store.updateTasks(od.map(function (t) { return { id: t.id, patch: { date: td } }; }));   /* 1回の GAS 実行で */
        rerenderTasks();
        showToast(od.length + '件を今日へ移しました', function () {
          snaps.forEach(function (x) { var t = x.t, sn = x.snap; t.date = sn.date; t.period = sn.period; syncWeekTask(t); });
          Store.updateTasks(snaps.map(function (x) { return { id: x.t.id, patch: { date: taskDateValue(x.t) } }; }));
          rerenderTasks();
        });
      });
      root.appendChild(taskGroup('積み残し', od, 'overdue', { adjust: true, showDate: true }, null, bulk));
    }
    var open = DUMMY_TASKS.filter(function (t) { return isOpen(t) && t.date === td && t.kind !== '☎連絡待ち' && t.kind !== '🗑ゴミ箱'; });
    open.sort(bySort);
    root.appendChild(taskGroup('今日やる', open, null, { sortable: true }, '今日のタスクはありません'));
    var waiting = DUMMY_TASKS.filter(function (t) { return isOpen(t) && t.date === td && t.kind === '☎連絡待ち'; });
    if (waiting.length) root.appendChild(taskGroup('連絡待ち', waiting, null, {}));   /* 自分がやる物と混ぜない */
    var done = DUMMY_TASKS.filter(function (t) { return t.status === 'Done' && t.date === td; });
    if (done.length) root.appendChild(taskGroup('完了', done, null, {}));

  } else if (view === 'adjust') {
    /* タスク管理（Notion の調整タブ相当）: TODAY と INBOX を並べる。
       INBOX ＝ 実施予定日が空の未完了（🗑ゴミ箱は出さない） */
    /* TODAY・INBOX とも種別ごとに分類して並べる（本人要望 2026-09-04） */
    var cols = el('div', 'adjust-cols');
    var open2 = DUMMY_TASKS.filter(function (t) { return isOpen(t) && t.date === td; });
    cols.appendChild(kindColumn('TODAY', 'planner', open2, { sortable: true }, 'まだ何も入っていません'));   /* 種別グループ内で並び替え可（2026-10-01） */
    var inbox = DUMMY_TASKS.filter(function (t) { return isOpen(t) && !t.date && t.kind !== '🗑ゴミ箱'; });
    cols.appendChild(kindColumn('INBOX', 'inbox', inbox, { assign: true }, 'INBOX は空です'));
    root.appendChild(cols);

  } else {
    /* すべて: 未完了全部をタスク種別でグループ（yet ビュー）。並びは KIND_ORDER と揃える */
    KIND_ORDER.forEach(function (kind) {
      var items = DUMMY_TASKS.filter(function (t) { return isOpen(t) && (t.kind || null) === kind; });
      if (!items.length) return;
      var ki = KIND_LABEL[kind];
      root.appendChild(taskGroup(ki ? ki.label : '未分類', items, null, { showDate: true, kind: true }));
    });
  }
}
