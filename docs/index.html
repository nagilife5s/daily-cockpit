/* 通院予定: 「09/28 (月) 17:00 歯医者 次回検診（…）」のような行が何件も入ってくる。
   行ごとに 日付 / 時刻 / 内容 に割って並べる。読めない行は原文のまま1行で出し、
   1件も日付として読めなければ元のテキストをそのまま出す（勝手に壊さない）。2026-09-11 */
var TSUIN_RE = /^[\s・\-–—]*(\d{1,2})\s*[\/月]\s*(\d{1,2})\s*日?\s*(?:[（(]\s*([^）)]*?)\s*[）)])?\s*(\d{1,2}\s*[:：]\s*\d{2})?\s*(.*)$/;
function tsuinCard(text) {
  var c = el('div', 'card wide');
  var h = el('h3');
  h.appendChild(iconSpan('stetho'));
  h.appendChild(document.createTextNode('通院予定'));
  c.appendChild(h);

  var lines = String(text || '').split(/\r?\n/).map(function (t) { return t.trim(); }).filter(Boolean);
  var rows = lines.map(function (line) {
    var m = TSUIN_RE.exec(line);
    if (!m) return null;
    return {
      date: (+m[1]) + '/' + (+m[2]) + (m[3] ? '(' + m[3] + ')' : ''),
      time: m[4] ? m[4].replace(/\s/g, '').replace('：', ':') : '',
      body: m[5] || ''
    };
  });
  if (!rows.some(Boolean)) {                       /* 日付形式が1件も無い＝ただの自由記述 */
    c.appendChild(el('p', text ? null : 'none', text || (state.loading ? '読み込み中…' : '—（未入力）')));
    return c;
  }
  var ul = el('ul', 'tsuin');
  rows.forEach(function (r, i) {
    var li = el('li');
    if (!r) {
      li.classList.add('plain');
      li.appendChild(el('span', 'n', lines[i]));
    } else {
      li.appendChild(el('span', 'd', r.date));
      li.appendChild(el('span', r.time ? 't' : 't non', r.time || '—'));
      li.appendChild(el('span', 'n', r.body));
    }
    ul.appendChild(li);
  });
  c.appendChild(ul);
  return c;
}

/* --- SP 日送りペイン --- */
function renderDayPane() {
  var date = state.selectedDate;
  var dd = dayData(date);                /* 週の中なら週 payload、外なら単日キャッシュ（2026-09-18） */
  var today = resolveToday();
  var np = nowPeriodInfo();
  var isToday = (date === today.date);   /* ★週グリッドがどの週を出していても、今日は今日（2026-09-18） */

  /* ヘッダーの日送り（2026-09-09 にヘッダーへ移動）。帯・日直等・その日のタスク・その日の情報を
     日送りする。★週グリッドとは完全に独立＝日送りで週は動かない（2026-09-18） */
  var pcHead = $('#pc-head');
  /* 「今日」バッジは付けない — 隣の「今日」ボタンが今日のとき disabled になるので二重になる */
  if (pcHead) pcHead.textContent = mdw(date);
  var pcDate = $('#pc-date');
  if (pcDate) pcDate.value = date || '';
  var pcToday = $('#pc-today');
  if (pcToday) pcToday.disabled = isToday;

  var head = $('#sp-head');
  head.innerHTML = '';
  head.appendChild(document.createTextNode(mdw(date)));
  head.appendChild(el('small', null, isToday ? '今日' : 'タップで今日へ'));

  /* 週をまたいで送れるようになったので矢印は常に生かす（2026-09-18） */
  $('#sp-prev').disabled = false;
  $('#sp-next').disabled = false;

  /* ドットは「その日が属する週の中での位置」（月〜金）。表示中の週とは無関係 */
  var di = dayIndexOf(date);
  var dots = $('#sp-dots');
  dots.textContent = '';
  for (var i = 0; i < 5; i++) {
    var d = el('i');
    if (i === di) d.classList.add('on');
    dots.appendChild(d);
  }

  /* 縦リスト: 全6行出す。空き行は低く薄く圧縮（位置情報は残す） */
  var list = $('#sp-list');
  list.textContent = '';
  var perCell = {};     /* period → [nodes] */
  visibleSchedule(dd.schedule).forEach(function (rec) {
    if (rec.excluded) return;   /* 関係なし＝週グリッド（SP 日送りリストも含む）には出さない（2026-09-09） */
    var c = classify(rec);
    if (c.hidden) return;
    c.runs.forEach(function (run) {
      (perCell[run.from] = perCell[run.from] || []).push(lessonCard(rec, run));
    });
  });
  /* タスクは週に依存しないので、週 payload の写しではなく全件（DUMMY_TASKS）から引く（2026-09-18）。
     これで表示週の外の日でも、その日に割り当てたタスクが校時行に出る */
  DUMMY_TASKS.forEach(function (task) {
    if (task.date !== date || !task.period) return;
    if (task.status === 'Done') return;   /* 完了したら時間割からは消す（2026-09-15） */
    (perCell[task.period] = perCell[task.period] || []).push(taskCard(task));
  });
  for (var p = 1; p <= 6; p++) {
    var row = el('div', 'day-row');
    var items = perCell[p];
    if (!items) {
      row.classList.add('empty');
      row.tabIndex = 0;
      row.setAttribute('role', 'button');
      row.setAttribute('aria-label', p + '校時 空き');
    }
    /* 校時行のタップでタスク割り当て（中身があっても、カード以外の場所なら追加できる） */
    (function (pp) {
      row.addEventListener('click', function (e) {
        if (e.target.closest('.lesson, .taskcard')) return;
        openTaskPicker(date, pp, e.clientX, e.clientY);
      });
    })(p);
    if (np && np.now === p && isToday) row.classList.add('is-now');
    var pn = el('div', 'pn');
    pn.appendChild(el('span', null, String(p)));
    pn.appendChild(el('small', null, PERIOD_START[p - 1]));
    row.appendChild(pn);
    var pc = el('div', 'pc');
    if (items) items.forEach(function (n) { pc.appendChild(n); });
    row.appendChild(pc);
    list.appendChild(row);
  }

  renderBands($('#pane-sp'), date);
  renderDayStrip($('#pane-sp'), date);
  renderDayTasks($('#pane-sp'), date);
  renderInfo($('#pane-sp'), date);

  /* PC ペインも同じ選択日で描く（2026-09-09。自分の週グリッドは対象外＝renderGrid は別途 refresh() が呼ぶ） */
  renderBands($('#pane-pc'), date);
  renderDayStrip($('#pane-pc'), date);
  renderDayTasks($('#pane-pc'), date);
  renderInfo($('#pane-pc'), date);

  /* 学校全体は「その日」の表なので日送りに追従させる（2026-09-09 本人要望で週表 → 日表に変更）。
     日が別の週に移ったら取り直しも要る（2026-09-18） */
  if (state.gridMode === 'school') ensureSchoolWide();
}

/* ==== 学校全体（校内コマDB）表示（2026-09-09 新設） ====
   グリッドエリアの「自分／学校全体」トグルで切替（PC #grid ⇄ #grid-school / SP #sp-list ⇄ #sp-list-school）。
   学校全体表示に切り替えたタイミングで取得しキャッシュする（頻繁に呼ぶものではないため）。
   学年・クラスの見出しは固定4種と決め打ちせず、取得データに実際にある値だけを動的にセクション化する。
   校内コマDBの実データ投入は別ワークフロー進行中のため 0件でも正しく案内を出す。 */
function ensureSchoolWide(force) {
  if (state.mode !== 'week' || state.gridMode !== 'school') return;
  /* ★学校全体は「その日」の表なので、取りに行く週は【表示日の週】（2026-09-18。
     週と日付が独立したので、表示週で引くと日送りした先が空表になる） */
  var ws = mondayOf(state.selectedDate || resolveToday().date);
  if (!force && state.schoolWide && state.schoolWide.weekStart === ws) {
    renderSchoolWideBoth();
    return;
  }
  state.schoolWideLoading = true;
  state.schoolWideError = '';
  renderSchoolWideBoth();
  Store.getSchoolWide(ws, function (payload) {
    if (ws !== mondayOf(state.selectedDate)) return;   /* 日送りで古い応答が来たら捨てる（loadWeek と同じ流儀） */
    state.schoolWide = payload;
    state.schoolWideLoading = false;
    renderSchoolWideBoth();
  }, function (err) {
    if (ws !== mondayOf(state.selectedDate)) return;
    state.schoolWideLoading = false;
    state.schoolWideError = (err && err.message) ? String(err.message) : '';
    renderSchoolWideBoth();
  });
}

function renderSchoolWideBoth() {
  renderSchoolWideTable($('#grid-school'));
  renderSchoolWideTable($('#sp-list-school'));
}

function renderSchoolWideTable(container) {
  if (!container) return;
  container.textContent = '';
  if (state.schoolWideLoading) { container.appendChild(el('div', 'empty', '読み込み中…')); return; }
  if (state.schoolWideError) {
    container.appendChild(el('div', 'empty', '校内コマDBを読めません（Notion 側でインテグレーションの接続を確認）: ' + state.schoolWideError));
    return;
  }
  var all = (state.schoolWide && state.schoolWide.items) || [];
  if (!all.length) {
    container.appendChild(el('div', 'empty', '校内コマDBにまだ登録がありません（学校全体の時間割は別ワークフローで投入中です）'));
    return;
  }
  /* 「その日」の表にする（2026-09-09 本人要望。週全体だと見たい日が埋もれる）。
     日は上の日送りで変える＝自分の時間割と同じ選択日に追従する */
  var date = state.selectedDate;
  var items = all.filter(function (it) { return it.date === date; });
  container.appendChild(el('h3', 'schoolwide-h', mdw(date) + ' の学校全体'));
  if (!items.length) {
    container.appendChild(el('div', 'empty', mdw(date) + ' は校内コマDBに登録がありません'));
    return;
  }
  /* 学年・クラスは固定4種と決め打ちせず、その日の実データにある値だけを列にする */
  var grades = [];
  items.forEach(function (it) { if (it.grade && grades.indexOf(it.grade) < 0) grades.push(it.grade); });
  grades.sort(function (a, b) { return a.localeCompare(b, 'ja', { numeric: true }); });

  var today = resolveToday();
  var np = nowPeriodInfo();
  var isToday = (date === today.date);   /* 学校全体も「その日」の表なので週とは無関係（2026-09-18） */

  var scroller = el('div', 'schoolwide-scroll');
  var g = el('div', 'grid school-grid');
  g.style.setProperty('--cols', String(grades.length));

  /* 1層目: ヘッダ（左上の空セル＋学年・クラス） */
  g.appendChild(el('div', 'ph'));
  grades.forEach(function (grade, i) {
    var h = el('div', 'gh');
    h.style.gridColumn = String(i + 2);
    h.style.gridRow = '1';
    h.appendChild(el('span', null, grade));
    g.appendChild(h);
  });

  /* 校時ヘッダ（左列）。「自分」と同じく番号＋開始時刻、今の校時に印 */
  for (var p = 1; p <= 6; p++) {
    var ph = el('div', 'ph');
    ph.style.gridColumn = '1';
    ph.style.gridRow = String(p + 1);
    ph.appendChild(el('span', null, String(p)));
    ph.appendChild(Object.assign(el('small'), { textContent: PERIOD_START[p - 1] }));
    if (isToday && np && np.now === p) ph.classList.add('is-now');
    g.appendChild(ph);
  }

  /* 中身。1コマに複数行あっても縦に積む（「自分」の cellbox と同じ流儀） */
  grades.forEach(function (grade, gi) {
    for (var p2 = 1; p2 <= 6; p2++) {
      var box = el('div', 'cellbox ro');
      box.style.gridColumn = String(gi + 2);
      box.style.gridRow = String(p2 + 1);
      items.filter(function (it) {
        return it.grade === grade && it.period === PERIOD_LABELS[p2 - 1] && it.subject;
      }).forEach(function (it) {
        var card = el('div', 'lesson ro');
        card.dataset.grade = normalizeGrade(grade);   /* 学年色を「自分」と揃える */
        card.appendChild(el('div', 'nm', it.subject));
        schoolWideNames(it).forEach(function (nm) {   /* そのコマで実際にやること（ナギレンダー由来） */
          card.appendChild(el('div', 'swnote', nm));
        });
        appendSchoolRelLinks(card, it);               /* 行事のときの書類・PJ・自分のコマへの導線 */
        box.appendChild(card);
      });
      g.appendChild(box);
    }
  });

  scroller.appendChild(g);
  container.appendChild(scroller);
}

/* そのコマで実際にやることを、ナギレンダー（＝正）から引いて返す（2026-09-10 新設）。
   校内コマDBに書き戻さず、表示のたびに突き合わせる方式にした（本人判断）。理由は
   ナギレンダーを後から直しても即座に反映されること、二重管理を作らないこと。
   突き合わせは 日付＋学年＋校時。学年は normalizeGrade で寄せ、`全校` は全学年に効く。
   **校時が入っているコマ（['3校時'] や ['5校時','6校時']）だけを出す。**
   校時指定のない終日の `行事`（例: ３年生職場体験）は上の行事帯に出ているので、
   グリッドには出さない（全コマが同じ文字で埋まるだけなので。2026-09-10 本人判断）。
   出張・部活・放課後・進路・private はどの校時にも一致しないので自然に落ちる。
   `関係なし` は「柳楽さんが出ない」という意味で学校の予定としては生きているため、
   学校全体の表では除外しない（自分の週グリッドとはここが違う）。 */
function schoolWideNames(it) {
  var sched = (state.week && state.week.schedule) || [], out = [];
  var g = normalizeGrade(it.grade);
  sched.forEach(function (r) {
    if (!r || r.date !== it.date || !r.name) return;
    if (r.grade !== '全校' && normalizeGrade(r.grade || '') !== g) return;
    if ((r.periodLabels || []).indexOf(it.period) < 0) return;
    if (out.indexOf(r.name) < 0) out.push(r.name);
  });
  return out;
}

/* 学校全体のコマにリレーションのリンクを出す（2026-09-10 新設）。
   ページ名と URL は getSchoolWideTimetable が relationTitles で返す。取れなかった分
   （キャッシュ切れ＋実引き打ち切り）は「Notion で開く」にして、開けなくならないようにする。
   カードのクリックで編集は開かない（学校全体は読み取り専用）が、将来増えても困らないよう
   リンクのクリックはここで止めておく。 */
function appendSchoolRelLinks(card, it) {
  var rels = (it && it.relations) || [];
  if (!rels.length) return;
  var titles = (state.schoolWide && state.schoolWide.relationTitles) || {};
  rels.forEach(function (r) {
    var meta = titles[r.id] || null;
    var name = meta ? meta.title : 'Notion で開く';
    var a = document.createElement('a');
    a.className = 'swrel';
    a.href = (meta && meta.url) || ('https://www.notion.so/' + String(r.id).replace(/-/g, ''));
    a.target = '_blank';
    a.rel = 'noopener';
    a.title = r.kind + '｜' + name;
    a.appendChild(el('span', 'swk', r.kind));
    a.appendChild(document.createTextNode(name));
    a.addEventListener('click', function (ev) { ev.stopPropagation(); });
    card.appendChild(a);
  });
}

/* 校内コマDBの「学年・クラス」は週によって表記が揺れる（とびのこ1／とびのこ１ 等）。
   カードの学年色（[data-cardstyle="grade"] .lesson[data-grade=...]）に合う値へ寄せる */
function normalizeGrade(g) {
  var s = String(g || '');
  if (s.indexOf('とび') === 0) return 'とびのこ';
  var m = s.match(/^([1-3])年/);
  if (m) return m[1] + '年';
  var z = s.match(/^([１-３])年/);            /* 全角の週もある */
  if (z) return '123'.charAt('１２３'.indexOf(z[1])) + '年';
  return s;
}

/* ==== 空きコマへのタスク割り当て（Phase 2 後半） ====
   入口は2つ: ①空きコマ（.slot / SPの空き校時行）をクリック → ピッカーで選ぶ
             ②グリッド上のタスクカードをドラッグ → 別のコマへ落とす
   書き込みは 実施予定日 = その日 + 標準時刻（PERIOD_START の6値、+09:00 付き）。
   README §6 の通り、標準6値しか書かないので授業側の時刻のブレと衝突しない */

function periodTimeStr(p) {            /* '8:35' → '08:35'（ISO用にゼロ詰め） */
  var a = PERIOD_START[p - 1].split(':');
  return ('0' + a[0]).slice(-2) + ':' + a[1];
}

function assignTaskToSlot(t, day, p) {
  var snap = taskSnap(t);
  t.date = day;
  t.period = p;
  syncWeekTask(t);
  Store.updateTask(t.id, { date: taskDateValue(t) });
  closeTaskPicker();
  withTransition(refresh);
  showToast('「' + t.name + '」を' + mdw(day) + ' ' + p + '校時に置きました', function () { restoreTask(t, snap); });
}

/* ---- タスクの新規作成（2026-09-15）。名前だけ入れて Enter。種別は ▶次に取るべき行動リスト ----
   空きコマのピッカーからは その日＋その校時、右の「今日のタスク」欄からは その日の日付だけで作る。
   Notion のページ ID が返るまで操作できないよう、楽観更新はせず作成後に差し込む */
var NEW_TASK_KIND = '▶次に取るべき行動リスト';
function quickAddForm(placeholder, onSubmit) {
  var f = el('form', 'quickadd');
  var inp = document.createElement('input');
  inp.type = 'text';
  inp.placeholder = placeholder;
  inp.setAttribute('aria-label', placeholder);
  inp.enterKeyHint = 'done';
  var b = el('button', null, '追加');
  b.type = 'submit';
  f.appendChild(inp);
  f.appendChild(b);
  f.addEventListener('submit', function (e) {
    e.preventDefault();
    var name = inp.value.trim();
    if (!name) { inp.focus(); return; }
    inp.value = '';
    onSubmit(name);
  });
  return f;
}
function createNewTask(name, day, p) {
  var where = mdw(day) + (p ? ' ' + p + '校時' : '');
  var date = taskDateValue({ date: day, period: p || null });
  showToast('「' + name + '」を作成中…');
  Store.createTask({ name: name, date: date, kind: NEW_TASK_KIND }, function (created) {
    if (!created || !created.id) return;
    if (!DUMMY_TASKS.some(function (x) { return x.id === created.id; })) DUMMY_TASKS.push(created);
    syncWeekTask(created);
    withTransition(refresh);
    showToast('「' + name + '」を' + where + 'に作りました', function () { removeNewTask(created); });
  });
}
function removeNewTask(t) {
  DUMMY_TASKS = DUMMY_TASKS.filter(function (x) { return x.id !== t.id; });
  if (state.week) state.week.tasks = (state.week.tasks || []).filter(function (x) { return x.id !== t.id; });
  Store.deleteTask(t.id);
  withTransition(refresh);
}

/* ---- ピッカー（候補 = 未完了・コマ未割り当てで、その日 / INBOX / 積み残し） ---- */
var pickerEl = null;
function closeTaskPicker() {
  if (!pickerEl) return;
  pickerEl.parentNode.removeChild(pickerEl);
  pickerEl = null;
  document.removeEventListener('pointerdown', pickerOutside, true);
}
function pickerOutside(e) {
  if (pickerEl && !pickerEl.contains(e.target)) closeTaskPicker();
}
function openTaskPicker(day, p, x, y) {
  closeTaskPicker();
  /* 候補＝その日に実施予定のタスクだけ（本人要望 2026-09-01: INBOX・積み残しは出さない） */
  var cands = DUMMY_TASKS.filter(function (t) {
    return isOpen(t) && !t.period && t.kind !== '🗑ゴミ箱' && t.date === day;
  });
  cands.sort(bySort);

  var pop = el('div', 'taskpicker card');
  pop.setAttribute('role', 'dialog');
  pop.appendChild(el('h3', null, mdw(day) + ' ' + p + '校時に割り当て'));

  /* このコマに置いてあるタスク（複数可）。「外す」で日付は残してコマだけ解除 */
  var placed = DUMMY_TASKS.filter(function (t) { return isOpen(t) && t.date === day && t.period === p; });
  if (placed.length) {
    var pl = el('div', 'tp-placed');
    placed.forEach(function (t) {
      var r = el('div', 'tp-placed-row');
      r.appendChild(el('span', 'tn', '☐ ' + t.name));
      var off = el('button', 'act', '外す');
      off.addEventListener('click', function () {
        setTaskDate(t, t.date);                        /* コマだけ外す（日付は維持） */
        openTaskPicker(day, p, x, y);                  /* 開いたまま更新 */
      });
      r.appendChild(off);
      pl.appendChild(r);
    });
    pop.appendChild(pl);
  }

  var listEl = el('div', 'tp-list');
  if (!cands.length) listEl.appendChild(el('div', 'empty', placed.length ? '他に置けるタスクはありません' : mdw(day) + ' のタスクがありません（Setup のタスク管理で日付を付けると出ます）'));
  cands.forEach(function (t) {
    var b = el('button', 'tp-item');
    b.appendChild(el('span', 'tn', t.name));
    var m = [];
    if (t.mikomi) m.push('~' + fmtMin(t.mikomi));
    if (t.kind === '☎連絡待ち') m.push('連絡待ち');
    if (m.length) b.appendChild(el('span', 'meta', m.join(' ')));
    b.addEventListener('click', function () {
      assignTaskToSlot(t, day, p);
      /* 1つ置いたら閉じず、続けて置けるように開き直す（候補が尽きたら閉じる） */
      var rest = DUMMY_TASKS.some(function (x) { return isOpen(x) && !x.period && x.kind !== '🗑ゴミ箱' && x.date === day; });
      if (rest) openTaskPicker(day, p, x, y);
    });
    listEl.appendChild(b);
  });
  pop.appendChild(listEl);

  /* 遠回りしなくて済むよう、INBOX・積み残しは折り畳みで出せる（既定では閉じる） */
  var more = DUMMY_TASKS.filter(function (t) {
    return isOpen(t) && !t.period && t.kind !== '🗑ゴミ箱' && t.date !== day && (!t.date || t.date < realToday());
  });
  if (more.length) {
    var moreBtn = el('button', 'tp-more', 'INBOX・積み残しから探す ▾（' + more.length + '）');
    moreBtn.addEventListener('click', function () {
      moreBtn.parentNode.removeChild(moreBtn);
      more.sort(bySort);
      more.forEach(function (t) {
        var b = el('button', 'tp-item');
        b.appendChild(el('span', 'tn', t.name));
        b.appendChild(el('span', 'meta', !t.date ? 'INBOX' : '積み残し ' + md(t.date)));
        b.addEventListener('click', function () { assignTaskToSlot(t, day, p); openTaskPicker(day, p, x, y); });
        listEl.appendChild(b);
      });
    });
    pop.appendChild(moreBtn);
  }

  /* タスクを新しく作ってこのコマに置く（2026-09-15） */
  pop.appendChild(quickAddForm('新しいタスクを作ってここに置く', function (name) {
    closeTaskPicker();
    createNewTask(name, day, p);
  }));

  /* 授業・予定の新規作成もここから（Phase 6） */
  var mk = el('button', 'tp-make', '＋ 授業・予定をつくる');
  mk.addEventListener('click', function () { openLessonEditor({ date: day, period: p }, x, y); });
  pop.appendChild(mk);

  document.body.appendChild(pop);

  /* クリック位置の近くに出し、画面からはみ出さないようクランプ */
  var W = pop.offsetWidth, H = pop.offsetHeight;
  var px = Math.min(Math.max(8, x - W / 2), window.innerWidth - W - 8);
  var py = y + 10;
  if (py + H > window.innerHeight - 8) py = Math.max(8, y - H - 10);
  pop.style.left = px + 'px';
  pop.style.top = py + 'px';
  pickerEl = pop;
  /* この起動クリック自身で即閉じないよう、外側クリック監視は次のティックから */
  setTimeout(function () { document.addEventListener('pointerdown', pickerOutside, true); }, 0);
}

document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape') { closeTaskPicker(); hideToast(); return; }
  /* role=button を付けた div（空きコマ・授業カード・月セル・空き校時行）は Enter/Space で押せる */
  if ((e.key === 'Enter' || e.key === ' ') && document.activeElement &&
      document.activeElement.getAttribute('role') === 'button' && document.activeElement.tagName !== 'BUTTON') {
    e.preventDefault();
    document.activeElement.click();
  }
});
/* タブは ←→ で移動できる */
$('#tabs').addEventListener('keydown', function (e) {
  if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
  var tabs = $all('#tabs button');
  var i = tabs.indexOf(document.activeElement);
  if (i < 0) return;
  var n = (i + (e.key === 'ArrowRight' ? 1 : -1) + tabs.length) % tabs.length;
  tabs[n].focus();
  tabs[n].click();
  e.preventDefault();
});

/* ---- グリッドの空きスロットをクリック → ピッカー ---- */
var suppressSlotClick = false;         /* ドラッグ直後の click を1回だけ無視する */
/* 時間帯の表でドラッグ中に「この校時に入る」を見せる影（1つを使い回す） */
var tlDropEl = null;
function showTlDrop(col, p) {
  if (!tlDropEl) tlDropEl = el('div', 'tl-drop');
  tlDropEl.style.top = ((PERIOD_MIN[p - 1] - col.dataset.lo) * TL_PX_PER_MIN) + 'px';
  tlDropEl.style.height = (PERIOD_LEN * TL_PX_PER_MIN) + 'px';
  tlDropEl.textContent = p + '校時';
  if (tlDropEl.parentNode !== col) col.appendChild(tlDropEl);
}
function hideTlDrop() { if (tlDropEl && tlDropEl.parentNode) tlDropEl.parentNode.removeChild(tlDropEl); }
$('#grid').addEventListener('click', function (e) {
  if (suppressSlotClick) return;
  if (e.target.closest('.lesson, .taskcard')) return;      /* カード自体のクリックは編集/ドラッグ側 */
  if (e.target.closest('.tl-admore')) {                  /* 終日帯の「＋N件」／「たたむ」 */
    tlAllDayOpen = !tlAllDayOpen;
    renderGrid();
    return;
  }
  var adc = e.target.closest('.tl-adc');                  /* 終日帯のチップ → 編集 */
  if (adc) {
    var arec = findLesson(adc.dataset.lid);
    if (arec) openLessonEditor({ rec: arec }, e.clientX, e.clientY);
    return;
  }
  /* 時間帯の表: 空いているところ → その時刻に近い校時のピッカー（2026-09-18） */
  var col = e.target.closest('.tl-col');
  if (col) {
    if (e.target.closest('.tl-ev')) return;
    openTaskPicker(col.dataset.day, nearestPeriod(tlMinAt(col, e.clientY)), e.clientX, e.clientY);
    return;
  }
  var s = e.target.closest('.slot, .cellbox');            /* 中身のあるコマにも複数置けるように */
  if (!s || !state.week || s.dataset.di == null) return;
  openTaskPicker(state.week.days[+s.dataset.di], +s.dataset.p, e.clientX, e.clientY);
});

/* ---- グリッド上のカード（タスク・授業）をドラッグして別のコマへ ---- */
$('#grid').addEventListener('pointerdown', function (e) {
  if (e.target.closest('.ck, .sci-link')) return;     /* ☐（完了ボタン）・「単元計画 ↗」はドラッグ開始にしない */
  var card = e.target.closest('.taskcard, .lesson');
  if (!card || !state.week) return;
  var isTask = card.classList.contains('taskcard');
  var t = isTask ? DUMMY_TASKS.find(function (x) { return x.id === card.dataset.tid; }) : null;
  var rec = isTask ? null : findLesson(card.dataset.lid);
  if (isTask ? !t : !rec) return;
  var isTouch = e.pointerType === 'touch';
  if (!isTouch) e.preventDefault();

  var sx = e.clientX, sy = e.clientY, moved = false, target = null;
  /* タッチ（iPad 等）は 350ms 長押しでドラッグ開始。それまでに動いたら通常のスクロールに譲る */
  var armed = !isTouch, holdTimer = null;
  if (isTouch) holdTimer = setTimeout(function () { armed = true; try { card.setPointerCapture(e.pointerId); } catch (err) {} }, 350);

  function onMove(ev) {
    var dx = ev.clientX - sx, dy = ev.clientY - sy;
    if (!armed) {
      if (Math.hypot(dx, dy) > 8) { clearTimeout(holdTimer); cleanup(); }   /* スクロール中 */
      return;
    }
    if (!moved && Math.hypot(dx, dy) < 5) return;   /* 5px までは誤ドラッグ扱い */
    if (!moved) { moved = true; card.classList.add('drag-card'); }
    card.style.transform = 'translate(' + dx + 'px,' + dy + 'px)';
    var below = document.elementFromPoint(ev.clientX, ev.clientY);
    var cell = below && below.closest ? below.closest('.slot, .cellbox, .tl-col') : null;
    if (target && target !== cell) target.classList.remove('drop-hint');
    target = (cell && (cell.dataset.di != null || cell.dataset.day)) ? cell : null;
    if (target && target.classList.contains('tl-col')) {
      /* 時間帯の表: 指の位置に近い校時を行き先にして、その枠を影で見せる */
      target.dataset.p = nearestPeriod(tlMinAt(target, ev.clientY));
      showTlDrop(target, +target.dataset.p);
    } else hideTlDrop();
    if (target) target.classList.add('drop-hint');
  }
  function cleanup() {
    clearTimeout(holdTimer);
    document.removeEventListener('pointermove', onMove);
    document.removeEventListener('pointerup', onUp);
    document.removeEventListener('pointercancel', onUp);
  }
  function onUp() {
    cleanup();
    hideTlDrop();
    if (target) target.classList.remove('drop-hint');
    card.classList.remove('drag-card');
    card.style.transform = '';
    if (moved) {                        /* 直後の click（ピッカー・編集）を1回だけ抑止 */
      suppressSlotClick = true;
      suppressLessonClick = true;
      setTimeout(function () { suppressSlotClick = false; suppressLessonClick = false; }, 300);
    }
    if (moved && target) {
      var day = target.dataset.day || state.week.days[+target.dataset.di], p = +target.dataset.p;
      if (isTask) {
        if (!(t.date === day && t.period === p)) { assignTaskToSlot(t, day, p); return; }
      } else {
        var from = +card.dataset.runFrom, to = +card.dataset.runTo;
        if (!(rec.date === day && from === p)) {
          /* 複数校時はスパンの長さを保って移動（6校時で頭打ち）。
             行事・部活など非時限ラベルは保持する */
          var periods = [];
          for (var i = 0; i < (to - from + 1) && p + i <= 6; i++) periods.push(PERIOD_ONLY[p + i - 1]);
          var keep = (rec.periodLabels || []).filter(function (l) { return PERIOD_ONLY.indexOf(l) < 0; });
          var prev = { date: rec.date, periods: (rec.periodLabels || []).slice(),
                       time: rec.time || null, endTime: rec.endTime || null };
          Store.updateLesson(rec.id, { date: day, periods: periods.concat(keep) }, reloadWeek);
          rec.date = day;               /* 楽観更新（reload で確定） */
          rec.periodLabels = periods.concat(keep);
          /* 時間帯の表は時刻で置くので、サーバー（lessonProps_）と同じく標準時程の開始へ。
             同日の範囲は長さを保って一緒に動かす */
          var ns = PERIOD_MIN[p - 1];
          rec.endTime = (prev.time && prev.endTime) ? minToHm(ns + hmToMin(prev.endTime) - hmToMin(prev.time)) : null;
          rec.time = PERIOD_START[p - 1];
          withTransition(refresh);
          showToast('「' + rec.name + '」を' + mdw(day) + ' ' + p + '校時へ移動しました', function () {
            rec.date = prev.date; rec.periodLabels = prev.periods;
            rec.time = prev.time; rec.endTime = prev.endTime;
            /* 元に戻すは時刻も明示して送る（送らないと標準時程に置かれ、短縮日課の時刻が消える） */
            Store.updateLesson(rec.id, { date: prev.date, periods: prev.periods,
                                         time: prev.time, endTime: prev.endTime }, reloadWeek);
            withTransition(refresh);
          });
          return;
        }
      }
    }
    if (moved) withTransition(refresh);               /* 無効ドロップは元の位置へ */
  }
  document.addEventListener('pointermove', onMove);
  document.addEventListener('pointerup', onUp);
  document.addEventListener('pointercancel', onUp);
});

/* ==== プロジェクトタブ（Phase 3。読み取り＋配下タスクの操作のみ） ====
   一覧 → 選ぶと GOAL / Action Plan / 内容 と配下タスク。
   プロジェクト自体のプロパティは表示のみ（README §3）。
   配下タスクは DUMMY_TASKS（= getWeek の allTasks）の projectIds から引く */
function projStatusChip(status) {
  var chip = el('span', 'kchip', status);
  var k = { 'In Progress': 'next', 'Done': 'someday' }[status];
  if (k) chip.dataset.kind = k;
  return chip;
}
function projTasksOf(pjId) {
  return DUMMY_TASKS.filter(function (t) { return (t.projectIds || []).indexOf(pjId) >= 0; });
}

function renderProjectTab() {
  var root = $('#project-root');
  root.textContent = '';

  if (!state.projects) {                      /* 未取得 → 取得して再描画 */
    root.appendChild(el('div', 'stateband', '読み込み中…'));
    if (renderProjectTab._loading) return;
    renderProjectTab._loading = true;
    Store.getProjects(function (list) {
      renderProjectTab._loading = false;
      state.projects = list || [];
      if (state.mode === 'project') withTransition(renderProjectTab);
    }, function () {
      renderProjectTab._loading = false;
      if (state.mode !== 'project') return;
      root.textContent = '';
      var sb = el('div', 'stateband', 'プロジェクトの取得に失敗しました。');
      var b = el('button', null, '再読み込み');
      b.addEventListener('click', function () { renderProjectTab(); });
      sb.appendChild(b);
      root.appendChild(sb);
    });
    return;
  }

  var pj = state.projectId && state.projects.find(function (x) { return x.id === state.projectId; });
  if (pj) renderProjectDetail(root, pj);
  else renderProjectList(root);
}

function projSort(a, b) {
  var so = { 'In Progress': 0, 'Not Started': 1, 'Done': 2 };
  if (so[a.status] !== so[b.status]) return so[a.status] - so[b.status];
  return (b.importance || '').length - (a.importance || '').length;
}

function renderProjectList(root) {
  ['仕事', 'プライベート'].forEach(function (kind) {
    /* 終わったプロジェクトは出さない（本人要望 2026-09-01）。Not Started は「これから」なので残す */
    var items = state.projects.filter(function (p) { return (p.kind || '仕事') === kind && p.status !== 'Done'; });
    if (!items.length) return;
    items.sort(projSort);
    var sec = el('div', 'pj-group');
    var h = el('h2', 'sec-h');
    h.appendChild(iconSpan('project'));
    h.appendChild(document.createTextNode(kind + ' '));
    h.appendChild(el('span', 'cnt', String(items.length)));
    sec.appendChild(h);
    items.forEach(function (p) {
      var b = el('button', 'pj-item' + (p.status === 'Done' ? ' done' : ''));
      b.appendChild(el('span', 'tn', p.name));
      if (p.importance) b.appendChild(el('span', 'imp', p.importance));
      b.appendChild(projStatusChip(p.status));
      var open = projTasksOf(p.id).filter(isOpen).length;
      var meta = [];
      if (p.periodEnd) meta.push('〜' + md(p.periodEnd));
      if (open) meta.push('タスク' + open);
      if (meta.length) b.appendChild(el('span', 'meta', meta.join('・')));
      b.addEventListener('click', function () {
        state.projectId = p.id;
        withTransition(renderProjectTab);
      });
      sec.appendChild(b);
    });
    root.appendChild(sec);
  });
  if (!root.children.length) root.appendChild(el('div', 'stateband', 'プロジェクトがありません'));
}

function renderProjectDetail(root, pj) {
  var back = el('button', 'pj-back', '‹ プロジェクト一覧');
  back.addEventListener('click', function () {
    state.projectId = null;
    withTransition(renderProjectTab);
  });
  root.appendChild(back);

  var head = el('div', 'pj-head');
  head.appendChild(el('h2', null, pj.name));
  if (pj.importance) head.appendChild(el('span', 'imp', pj.importance));
  head.appendChild(projStatusChip(pj.status));
  if (pj.periodStart || pj.periodEnd) {
    head.appendChild(el('span', 'meta', (pj.periodStart ? md(pj.periodStart) : '') + '〜' + (pj.periodEnd ? md(pj.periodEnd) : '')));
  }
  if (pj.url) {                                       /* Notion のページへ */
    var a = document.createElement('a');
    a.className = 'pj-open';
    a.href = pj.url;
    a.target = '_blank';
    a.rel = 'noopener';
    a.textContent = 'Notion で開く ↗';
    head.appendChild(a);
  }
  root.appendChild(head);

  var cards = el('div', 'pj-cards');
  [['GOAL', pj.goal], ['Action Plan', pj.plan], ['内容', pj.naiyo]].forEach(function (pair) {
    if (!pair[1]) return;
    var c = el('div', 'card');
    c.appendChild(el('h3', null, pair[0]));
    c.appendChild(el('p', null, pair[1]));
    cards.appendChild(c);
  });
  if (cards.children.length) root.appendChild(cards);

  /* ---- ページ本文（開いたときに取得。取得済みはキャッシュから） ---- */
  var bodyCard = el('div', 'card pj-bodycard');
  bodyCard.appendChild(el('h3', null, '本文'));
  var bd = el('div', 'pj-body');
  bodyCard.appendChild(bd);
  root.appendChild(bodyCard);

  function showBody(html) {
    bd.innerHTML = html || '<p class="none">本文はありません</p>';
  }
  var cached = state.projectBodies[pj.id];
  if (cached === undefined) {                          /* 未取得 → 取りに行く */
    state.projectBodies[pj.id] = null;
    bd.innerHTML = '<p class="none">読み込み中…</p>';
    Store.getProjectBody(pj.id, function (res) {
      state.projectBodies[pj.id] = (res && res.html) || '';
      if (state.mode === 'project' && state.projectId === pj.id) {
        var cur = $('#project-root .pj-body');
        if (cur) cur.innerHTML = state.projectBodies[pj.id] || '<p class="none">本文はありません</p>';
      }
    }, function () {
      state.projectBodies[pj.id] = '<p class="none">本文の取得に失敗しました。「Notion で開く」から確認してください。</p>';
      if (state.mode === 'project' && state.projectId === pj.id) {
        var cur = $('#project-root .pj-body');
        if (cur) cur.innerHTML = state.projectBodies[pj.id];
      }
    });
  } else if (cached === null) {                        /* 取得中 */
    bd.innerHTML = '<p class="none">読み込み中…</p>';
  } else {
    showBody(cached);
  }

  var tasks = projTasksOf(pj.id);
  var open = tasks.filter(isOpen);
  open.sort(bySort);
  root.appendChild(taskGroup('タスク', open, null, { showDate: true, periodSel: true },
                             'このプロジェクトの未完了タスクはありません'));
  var done = tasks.filter(function (t) { return t.status === 'Done'; });
  if (done.length) root.appendChild(taskGroup('完了', done, null, { showDate: true }));
}

/* ==== 月タブ（Phase 4。ナギレンダーの月カレンダー。表示のみ） ====
   行事・出張・休み・部活/放課後/進路をチップで、授業はセル右下に件数だけ。
   日付セルをクリックするとその週の週タブへ飛ぶ（SP はその日にフォーカス） */
function addMonthsYm(ym, n) {
  var a = ym.split('-');
  var m = (+a[1]) - 1 + n;
  var y = (+a[0]) + Math.floor(m / 12);
  m = ((m % 12) + 12) % 12;
  return y + '-' + String(m + 1).padStart(2, '0');
}
function mondayOfStrict(ymd) {          /* 月グリッド用: 土日も「その週の月曜」に */
  return addDays(ymd, -((dowOf(ymd) + 6) % 7));
}

function renderMonthTab() {
  var root = $('#month-root');
  root.textContent = '';
  if (!state.monthYm) state.monthYm = (MOCK_TODAY || jstTodayString()).slice(0, 7);
  var ym = state.monthYm;

  /* 月ナビ */
  var nav = el('div', 'mnav');
  var prev = el('button', null, '‹');
  prev.addEventListener('click', function () { state.monthYm = addMonthsYm(ym, -1); withTransition(renderMonthTab); });
  var label = el('span', 'mlabel', (+ym.slice(0, 4)) + '年' + (+ym.slice(5, 7)) + '月');
  var next = el('button', null, '›');
  next.addEventListener('click', function () { state.monthYm = addMonthsYm(ym, 1); withTransition(renderMonthTab); });
  var thisM = el('button', 'thismonth', '今月');
  var curYm = (MOCK_TODAY || jstTodayString()).slice(0, 7);
  thisM.disabled = ym === curYm;
  thisM.addEventListener('click', function () { state.monthYm = curYm; withTransition(renderMonthTab); });
  nav.appendChild(prev); nav.appendChild(label); nav.appendChild(next); nav.appendChild(thisM);
  nav.appendChild(el('span', 'mnote', '日付をクリックでその週へ'));
  root.appendChild(nav);
  root.appendChild(buildKindFilterRow());   /* 区分フィルタ（2026-09-29 から月タブ専用） */

  var events = state.months[ym];
  if (events === undefined) {           /* 未取得 → 取りに行く */
    state.months[ym] = null;
    root.appendChild(el('div', 'stateband', '読み込み中…'));
    Store.getMonth(ym, function (res) {
      state.months[res.ym] = (res && res.events) || [];
      if (state.mode === 'month' && state.monthYm === res.ym) withTransition(renderMonthTab);
    }, function () {
      delete state.months[ym];
      if (state.mode !== 'month' || state.monthYm !== ym) return;
      root.textContent = '';
      root.appendChild(nav);
      root.appendChild(buildKindFilterRow());
      var sb = el('div', 'stateband', '取得に失敗しました。');
      var b = el('button', null, '再読み込み');
      b.addEventListener('click', function () { renderMonthTab(); });
      sb.appendChild(b);
      root.appendChild(sb);
    });
    return;
  }
  if (events === null) {                /* 取得中 */
    root.appendChild(el('div', 'stateband', '読み込み中…'));
    return;
  }

  /* 区分フィルタ（2026-09-18）。全部 OFF なら空カレンダーにせず、その旨を出して終わる */
  var mf = state.monthKindFilter;
  if (allKindsOff(mf)) {
    root.appendChild(el('div', 'stateband', '表示する区分が選ばれていません'));
    return;
  }
  var visibleEvents = events.filter(function (rec) { return !rec.excluded && mf[kindOf(rec)]; });

  /* 日別に整理。月タブは【全部見せる】方針（本人要望 2026-09-01）:
     行事系・放課後系はバンド色、授業は学年色、private も金色で出す */
  /* 2026-09-29: Googleカレンダーのように【全件を名前で】見せる。件数の上限は設けず、セルが縦に伸びる。
     複数日の予定（教育相談の期間など）は期間中の毎日に出す */
  var byDay = {};
  function pushChip(date, ch) { (byDay[date] = byDay[date] || { chips: [] }).chips.push(ch); }
  visibleEvents.forEach(function (rec) {
    var ch;
    if ((rec.periodLabels || []).indexOf('private') >= 0) {
      ch = { name: rec.name, color: 'private', time: rec.time };
    } else {
      var c = classify(rec);
      if (c.events.length || c.after.length) {
        ch = { name: rec.name, color: colorFor(rec, c), time: rec.time };
      } else if (c.runs.length) {
        ch = { name: rec.name, lesson: true, grade: rec.grade, time: rec.time, firstP: c.runs[0].from,
               periods: c.runs.map(function (r) { return r.from === r.to ? r.from + '校時' : r.from + '〜' + r.to + '校時'; }).join('・') };
      } else {
        ch = { name: rec.name, color: 'work', time: rec.time };   /* 時限が空の予定も落とさない */
      }
    }
    var endD = rec.endDate && rec.endDate > rec.date ? rec.endDate : rec.date;
    if (endD > rec.date) ch.span = true;
    for (var d = rec.date, n = 0; d <= endD && n < 62; d = addDays(d, 1), n++) pushChip(d, ch);
  });
  /* 並び: 終日（期間・行事）→ 時刻順。授業は校時の標準時刻で並べる */
  function chipKey(ch) {
    if (ch.time) return hmToMin(ch.time);
    if (ch.lesson && ch.firstP) return PERIOD_MIN[ch.firstP - 1];
    return -1;
  }
  Object.keys(byDay).forEach(function (k) {
    byDay[k].chips.sort(function (x, y) { return chipKey(x) - chipKey(y); });
  });

  /* スマホはタップで下にその日のリストを展開（セルの中も名前で出す） */
  var compact = window.matchMedia('(max-width: 700px)').matches;

  /* グリッド: 月曜始まり・6週分までで当月を覆う */
  var grid = el('div', 'mcal');
  ['月', '火', '水', '木', '金', '土', '日'].forEach(function (w, i) {
    var h = el('div', 'mch', w);
    if (i === 5) h.classList.add('sat');
    if (i === 6) h.classList.add('sun');
    grid.appendChild(h);
  });
  var first = ym + '-01';
  var last = addDays(addMonthsYm(ym, 1) + '-01', -1);
  var cur = mondayOfStrict(first);
  var today = MOCK_TODAY || jstTodayString();
  while (cur <= last) {
    for (var i = 0; i < 7; i++) {
      var date = addDays(cur, i);
      var cell = el('div', 'mc-cell');
      if (i >= 5) cell.classList.add('wk');
      if (date.slice(0, 7) !== ym) cell.classList.add('out');
      if (date === today) cell.classList.add('is-today');
      cell.appendChild(el('span', 'dn', String(+date.slice(8, 10))));
      cell.tabIndex = 0;
      cell.setAttribute('role', 'button');
      cell.setAttribute('aria-label', mdw2(date) + (byDay[date] ? ' 予定' + byDay[date].chips.length + '件' : ''));
      if (compact && state.monthSel === date) cell.classList.add('sel');
      var d = byDay[date];
      /* スマホも点ではなく名前で出す（2026-09-29）。タップで下に一覧も開く */
      if (d) d.chips.forEach(function (ch) { cell.appendChild(monthChip(ch)); });
      (function (dd) {
        cell.addEventListener('click', function () {
          if (compact) { state.monthSel = dd; renderMonthTab(); return; }   /* スマホは下に展開 */
          jumpToWeek(dd);
        });
      })(date);
      grid.appendChild(cell);
    }
    cur = addDays(cur, 7);
  }
  root.appendChild(grid);
  if (mf.shinro) root.appendChild(buildSchoolLegend());   /* 進路チェック中だけ学校色の凡例 */

  /* スマホ: 選んだ日の予定リスト */
  if (compact && state.monthSel) {
    var sel = state.monthSel;
    var panel = el('div', 'card mc-detail');
    var h3 = el('h3', null, mdw2(sel) + ' の予定');
    panel.appendChild(h3);
    var items = (byDay[sel] || { chips: [] }).chips;
    if (!items.length) panel.appendChild(el('p', 'none', '予定はありません'));
    items.forEach(function (ch) {
      var r = el('div', 'row');
      var dot = el('i');
      if (ch.lesson) { dot.className = 'mc-lesson'; dot.dataset.grade = ch.grade || ''; }
      else dot.dataset.color = ch.color;
      r.appendChild(dot);
      r.appendChild(el('span', 'tm', ch.lesson ? (ch.periods || '') : (ch.time || '終日')));
      r.appendChild(el('span', 'nm', ch.name));
      panel.appendChild(r);
    });
    var go = el('button', 'pj-back', 'この週の週タブへ ›');
    go.style.marginTop = '8px';
    go.addEventListener('click', function () { jumpToWeek(sel); });
    panel.appendChild(go);
    root.appendChild(panel);
    panel.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  }
}
/* 土日も含めた曜日付き表示（月タブ用） */
/* 月セルの予定1件。時刻があれば頭に付ける。名前は折り返して全文見せる */
function monthChip(ch) {
  var c = el('div', 'mc-chip' + (ch.lesson ? ' mc-lesson' : '') + (ch.span ? ' mc-span' : ''));
  if (ch.lesson) c.dataset.grade = ch.grade || '';
  else c.dataset.color = ch.color;
  if (ch.time) c.appendChild(el('span', 'mc-tm', ch.time));
  c.appendChild(document.createTextNode(ch.name));
  c.title = (ch.time ? ch.time + ' ' : (ch.periods ? ch.periods + ' ' : '')) + ch.name;
  return c;
}
function mdw2(ymd) { return mdw(ymd); }   /* 旧・土日対応版。mdw が7曜に対応したので同じ（2026-09-18） */
function jumpToWeek(dd) {
  state.mode = 'week';
  pendingFocus = dd;
  loadWeek(mondayOf(dd));               /* 土日は翌週月曜へ丸める（週タブの流儀） */
}

/* ==== 時間割コマの編集（Phase 6） ====
   ・授業カードをクリック → 編集フォーム（名前・日付・時限・学年・場所・概要・詳細メモ・フィードバック・削除）
   ・空きコマのピッカー下部「＋ 授業・予定をつくる」→ 新規作成（日付・校時が入った状態）
   ・グリッド上の授業カードはドラッグで別のコマへ（複数校時はスパンごと移動）
   保存・削除後は週を取り直す（データの正は Notion） */
var PERIOD_ONLY = ['1校時', '2校時', '3校時', '4校時', '5校時', '6校時'];
var GRADE_OPTIONS = ['1年', '2年', '3年', '全校', 'その他', '部活', 'とびのこ', 'とび'];
var PLACE_OPTIONS = ['理科室', '教室', '吉賀中'];

/* 取り直し。週外の日のキャッシュも捨てて、表示日も一緒に新しくする（2026-09-18） */
function reloadWeek() { state.days = {}; loadWeek(state.weekStart); }

/* 週の外の日を見ているときもコマを編集できるよう、週外キャッシュも一緒に探す（2026-09-18） */
function findLesson(id) {
  var hit = null;
  allSchedules().some(function (arr) {
    var r = arr.find(function (x) { return x.id === id; });
    if (r) { hit = r; return true; }
    return false;
  });
  return hit;
}

function openLessonEditor(opts, x, y) {
  closeTaskPicker();
  var rec = opts.rec || null;
  /* 1〜6校時以外のラベル（行事・部活など）は編集対象外としてそのまま保持する */
  var keepLabels = rec ? (rec.periodLabels || []).filter(function (l) { return PERIOD_ONLY.indexOf(l) < 0; }) : [];

  var pop = el('div', 'taskpicker lesson-editor card');
  pop.appendChild(el('h3', null, rec ? 'コマを編集' : '授業・予定をつくる'));

  function frow(label, node) {
    var r = el('div', 'fr');
    r.appendChild(el('b', null, label));
    r.appendChild(node);
    return r;
  }
  var nameIn = document.createElement('input');
  nameIn.type = 'text';
  nameIn.placeholder = '例: 理科【２年】⑧';

  var memoIn = document.createElement('input');

  if (rec && (rec.relations || []).length) {

/* ==== Docs タブ（Phase 5。書類DB の頻出一覧＋検索＋頻出トグル） ====
   編集できるのは 頻出チェックだけ（README §4）。本文が要るときは「Notion で開く」 */
function docItem(doc) {
  var item = el('div', 'doc-item');
  var head = el('button', 'doc-head');
  head.appendChild(el('span', 'tn', doc.name));
  (doc.kinds || []).slice(0, 2).forEach(function (k) { head.appendChild(el('span', 'doc-kind', k)); });
  var meta = el('span', 'meta');
  if (doc.deadline) meta.appendChild(el('span', 'due', '〆' + md(doc.deadline)));
  if (meta.children.length) head.appendChild(meta);
  head.addEventListener('click', function () {
    state.docOpenId = state.docOpenId === doc.id ? null : doc.id;
    renderDocsTab();
  });
  item.appendChild(head);

  if (state.docOpenId === doc.id) {
    var dt = el('div', 'doc-detail');
    [['メモ', doc.memo],
     ['進捗状況', doc.shinchoku],
     ['〆切', doc.deadline ? md(doc.deadline) : ''],
     ['実施日', doc.jisshi ? md(doc.jisshi) : ''],
     ['種類', (doc.kinds || []).join('・')],
     ['年度', (doc.years || []).join('・')],
     ['添付', (doc.files || []).join('\n')]].forEach(function (pair) {
      if (!pair[1]) return;
      var row = el('div', 'row');
      row.appendChild(el('b', null, pair[0]));
      row.appendChild(el('span', null, pair[1]));
      dt.appendChild(row);
    });

    var acts = el('div', 'acts');
    if (doc.url) {
      var a = document.createElement('a');
      a.className = 'act open';
      a.href = doc.url; a.target = '_blank'; a.rel = 'noopener';
      a.textContent = 'Notion で開く ↗';
      acts.appendChild(a);
    }
    var pin = el('button', 'act pin', doc.hinshutsu ? '★ 頻出から外す' : '☆ 頻出に追加');
    pin.addEventListener('click', function () { toggleHinshutsu(doc); });
    acts.appendChild(pin);
    dt.appendChild(acts);
    item.appendChild(dt);
  }
  return item;
}

function toggleHinshutsu(doc) {
  doc.hinshutsu = !doc.hinshutsu;
  Store.updateDoc(doc.id, { hinshutsu: doc.hinshutsu });
  if (state.docs) {
    state.docs = state.docs.filter(function (d) { return d.id !== doc.id; });
    if (doc.hinshutsu) state.docs.push(doc);
  }
  /* 検索結果側の同じ書類にも反映しておく（同一オブジェクトなら不要だが安全側） */
  (state.docResults || []).forEach(function (d) { if (d.id === doc.id) d.hinshutsu = doc.hinshutsu; });
  renderDocsTab();
}

function docSort(a, b) {
  var ad = a.deadline || '9999-99-99', bd = b.deadline || '9999-99-99';
  if (ad !== bd) return ad < bd ? -1 : 1;
  return a.name < b.name ? -1 : 1;
}

function renderDocsTab() {
  var root = $('#docs-root');
  root.textContent = '';

  /* 検索バー（書類名の部分一致で書類DB全体から探し、頻出に追加する入口） */
  var bar = el('div', 'docsearch');
  var inp = document.createElement('input');
  inp.type = 'search';
  inp.placeholder = '書類名で検索（頻出に追加したい書類を探す）';
  inp.value = state.docQuery;
  var go = el('button', null, '検索');
  function doSearch() {
    var q = inp.value.trim();
    state.docQuery = q;
    if (!q) { state.docResults = null; renderDocsTab(); return; }
    state.docResults = [];
    renderDocsTab();
    Store.searchDocs(q, function (list) {
      if (state.mode !== 'often' || state.docQuery !== q) return;
      state.docResults = list || [];
      state.docResults._done = true;
      renderDocsTab();
    }, function () {
      if (state.mode !== 'often') return;
      state.docResults = [];
      state.docResults._done = true;
      renderDocsTab();
    });
  }
  inp.addEventListener('keydown', function (e) { if (e.key === 'Enter') doSearch(); });
  go.addEventListener('click', doSearch);
  bar.appendChild(inp);
  bar.appendChild(go);
  root.appendChild(bar);

  /* 検索結果（検索中のみ表示） */
  if (state.docResults) {
    var rh = el('h2', 'sec-h');
    rh.appendChild(iconSpan('inbox'));
    rh.appendChild(document.createTextNode('検索結果 '));
    rh.appendChild(el('span', 'cnt', String(state.docResults.length)));
    root.appendChild(rh);
    if (!state.docResults.length) {
      root.appendChild(el('div', 'doc-empty', state.docResults._done ? '見つかりませんでした' : '検索中…'));
    } else {
      state.docResults.forEach(function (d) { root.appendChild(docItem(d)); });
    }
  }

  /* 頻出一覧 */
  var h = el('h2', 'sec-h');
  h.appendChild(iconSpan('often'));
  h.appendChild(document.createTextNode('よく使う書類 '));
  h.appendChild(el('span', 'cnt', state.docs ? String(state.docs.length) : ''));
  root.appendChild(h);

  if (!state.docs) {
    root.appendChild(el('div', 'stateband', '読み込み中…'));
    if (renderDocsTab._loading) return;
    renderDocsTab._loading = true;
    Store.getDocs(function (list) {
      renderDocsTab._loading = false;
      state.docs = list || [];
      if (state.mode === 'often') withTransition(renderDocsTab);
    }, function () {
      renderDocsTab._loading = false;
      if (state.mode !== 'often') return;
      root.textContent = '';
      root.appendChild(bar);
      var sb = el('div', 'stateband', '取得に失敗しました。');
      var b = el('button', null, '再読み込み');
      b.addEventListener('click', function () { renderDocsTab(); });
      sb.appendChild(b);
      root.appendChild(sb);
    });
    return;
  }
  if (!state.docs.length) {
    root.appendChild(el('div', 'doc-empty', '頻出の書類はまだありません。上の検索から追加できます'));
    return;
  }
  var docs = state.docs.slice();
  docs.sort(docSort);
  docs.forEach(function (d) { root.appendChild(docItem(d)); });
}

/* ==========================================================================
   Science タブ（2026-10-02。設計メモ｜理科タブ.md）。Phase 1 は閲覧のみ
   ========================================================================== */
var SCI_GRADES = ['1年', '2年', '3年'];

function sciGroupKey(u) { return u.grade + '|' + u.unitName; }

/* 学年内の単元グループ（単元No順）。各グループの本時は 時数 順 */
function sciGroups(grade) {
  var map = {}, order = [];
  state.science.units.forEach(function (u) {
    if (u.grade !== grade) return;
    var k = sciGroupKey(u);
    if (!map[k]) { map[k] = { key: k, name: u.unitName, no: u.unitNo ? +u.unitNo : 99, area: u.area, lessons: [] }; order.push(map[k]); }
    map[k].lessons.push(u);
  });
  order.forEach(function (g) {
    g.lessons.sort(function (a, b) {
      var ah = a.hour == null ? 999 : a.hour, bh = b.hour == null ? 999 : b.hour;
      return ah !== bh ? ah - bh : (a.name < b.name ? -1 : 1);
    });
    g.done = g.lessons.filter(function (l) { return l.status === 'Done'; }).length;
  });
  order.sort(function (a, b) { return a.no !== b.no ? a.no - b.no : (a.name < b.name ? -1 : 1); });
  return order;
}

/* 学年を切り替えたとき・初期表示で開く単元: 最初の status=not の単元（全部 Done なら先頭） */
function sciFirstOpenGroup(grade) {
  var gs = sciGroups(grade);
  for (var i = 0; i < gs.length; i++) if (gs[i].done < gs[i].lessons.length) return gs[i].key;
  return gs.length ? gs[0].key : null;
}

/* 初期表示: 今日以降で最初の理科授業の学年・紐づく単元 → 前回の学年 → 1年 */
function sciInitSelection() {
  var sc = state.science, grade = null, group = null, open = null;
  function byId(id) { id = String(id).replace(/-/g, ''); return sc.units.filter(function (u) { return u.id.replace(/-/g, '') === id; })[0] || null; }
  var focus = state.sciFocus; state.sciFocus = null;   /* 理科授業カードからの遷移は「次の授業」より優先 */
  var nu = (focus && byId(focus)) || (sc.next && sc.next.unitId ? byId(sc.next.unitId) : null);
  if (nu) {
    grade = nu.grade; group = sciGroupKey(nu); open = nu.id;
  } else {
    if (sc.next && sc.next.grade) grade = sc.next.grade;
    if (!grade) { try { grade = localStorage.getItem('dc.sciGrade'); } catch (e) {} }
    if (SCI_GRADES.indexOf(grade) < 0) grade = '1年';
    group = sciFirstOpenGroup(grade);
  }
  state.sciGrade = grade; state.sciGroup = group; state.sciOpenId = open;
}

function sciLoadDetail(id) {
  if (state.sciDetail[id] !== undefined) return;
  state.sciDetail[id] = null;
  Store.getScienceUnitDetail(id, function (d) {
    state.sciDetail[id] = d || 'error';
    if (state.mode === 'science') renderScienceTab();
  }, function () {
    state.sciDetail[id] = 'error';
    if (state.mode === 'science') renderScienceTab();
  });
}

/* 一覧に出す実施日バッジ: 今日以降で最初の日、無ければ直近の過去日 */
function sciDateBadge(u) {
  var today = state.science.today, ds = u.lessons.map(function (l) { return l.date; });
  if (!ds.length) return el('span', 'sci-badge undated', '日程未定');
  var next = ds.filter(function (d) { return d >= today; })[0];
  var d = next || ds[ds.length - 1];
  var b = el('span', 'sci-badge date', mdw(d) + (ds.length > 1 ? ' +' + (ds.length - 1) : ''));
  return b;
}

function sciLessonItem(u) {
  var today = state.science.today;
  var isDone = u.status === 'Done';
  var item = el('div', 'doc-item sci-lesson' + (isDone ? ' done' : ''));
  var head = el('button', 'doc-head');
  head.appendChild(el('span', 'hr', u.hour == null ? '' : String(u.hour)));
  head.appendChild(el('span', 'tn', u.name || '(無題)'));
  var badges = el('span', 'sci-badges');
  if (isDone) badges.appendChild(el('span', 'sci-badge ok', '✓'));
  else if (u.lessons.length && u.lessons[u.lessons.length - 1].date < today) badges.appendChild(el('span', 'sci-badge warn', '要確認'));
  badges.appendChild(sciDateBadge(u));
  [['kahoot', u.counts.kahoot], ['実験', u.counts.recipe], ['AF', u.counts.artifact], ['WS', u.counts.worksheet]].forEach(function (c) {
    if (c[1]) badges.appendChild(el('span', 'sci-badge', c[0] + ' ' + c[1]));
  });
  head.appendChild(badges);
  head.addEventListener('click', function () {
    state.sciOpenId = state.sciOpenId === u.id ? null : u.id;
    renderScienceTab();
  });
  var selL = state.sciSel && state.sciLessons ? state.sciLessons.filter(function (x) { return x.id === state.sciSel; })[0] : null;
  if (selL) {                                         /* 左で授業を選んでいる間は、各本時に「← 紐づけ」を出す */
    var row0 = el('div', 'sci-row');
    row0.appendChild(head);
    var sgU = selL.unitId ? null : sciSuggest(selL);
    var isCur = selL.unitId && sciNorm(selL.unitId) === sciNorm(u.id);
    if (!isCur) {
      var pk = el('button', 'sci-pick' + (sgU && sgU.id === u.id ? ' sug' : ''), '← 紐づけ');
      pk.type = 'button';
      pk.addEventListener('click', function () { sciLink(selL, u.id); });
      row0.appendChild(pk);
    }
    item.appendChild(row0);
  } else {
    item.appendChild(head);
  }

  if (state.sciOpenId === u.id) {
    var dt = el('div', 'doc-detail');
    function row(label, node) {
      var r = el('div', 'row');
      r.appendChild(el('b', null, label));
      if (typeof node === 'string') r.appendChild(el('span', null, node)); else r.appendChild(node);
      dt.appendChild(r);
    }
    if (u.goal) row('目標', u.goal);
    if (u.flow) row('流れ', u.flow);
    if (u.tools) row('道具', u.tools);
    if (u.forms.length) row('授業形態', u.forms.join('・'));
    if (u.view) row('見方', u.view);
    if (u.lessons.length) row('実施日', u.lessons.map(function (l) {
      return mdw(l.date) + (l.periodLabels.length ? ' ' + l.periodLabels.join('・') : '');
    }).join('\n'));
    /* フィードバックは常にテキスト欄（Phase 3）。フォーカスが外れたとき、変わっていれば保存 */
    var fb = document.createElement('textarea');
    fb.rows = 2;
    fb.value = u.feedback || '';
    fb.placeholder = '授業後の振り返り';
    fb.style.cssText = 'flex:1;min-width:0;font:inherit;font-size:var(--fs-sm);border:1px solid var(--line);border-radius:6px;padding:4px 6px;background:var(--paper);color:var(--ink);';
    fb.addEventListener('blur', function () {
      if (fb.value === (u.feedback || '')) return;
      u.feedback = fb.value;
      Store.updateUnitPlan(u.id, { feedback: fb.value });
      showToast('フィードバックを保存しました');
    });
    row('フィードバック', fb);

    /* 関連ページ名は展開したときだけ取る（件数ゼロなら取りに行かない） */
    var anyRel = u.counts.kahoot || u.counts.recipe || u.counts.artifact || u.counts.worksheet;
    if (anyRel) {
      sciLoadDetail(u.id);
      var d = state.sciDetail[u.id];
      if (d === null || d === undefined) row('関連', el('span', 'doc-empty', '読み込み中…'));
      else if (d === 'error') row('関連', el('span', 'doc-empty', '取得できませんでした'));
      else {
        [['kahoot', d.kahoot], ['実験レシピ', d.recipes], ['アーティファクト', d.artifacts]].forEach(function (g) {
          if (!g[1] || !g[1].length) return;
          var box = el('span', 'sci-rel');
          g[1].forEach(function (it) {
            if (it.url) { var a = el('a', null, it.title); a.href = it.url; a.target = '_blank'; a.rel = 'noopener'; box.appendChild(a); }
            else box.appendChild(el('span', 'na', it.title));
          });
          row(g[0], box);
        });
        if (d.worksheets && d.worksheets.length) row('ワークシート', d.worksheets.join('\n') + '\n（開くには Notion へ）');
      }
    }

    var acts = el('div', 'acts');
    if (u.url) {
      var a = el('a', 'act open', 'Notion で開く ↗');
      a.href = u.url; a.target = '_blank'; a.rel = 'noopener';
      acts.appendChild(a);
    }
    var st = el('button', 'act pin', isDone ? '↩ 未実施に戻す' : '✓ Done にする');

/* ---- 左ペイン（ナギレンダーの理科の授業）。2026-10-02 ---- */
function sciNorm(id) { return String(id || '').replace(/-/g, ''); }
function sciUnitById(id) {
  var n = sciNorm(id);
  return state.science.units.filter(function (u) { return sciNorm(u.id) === n; })[0] || null;
}
function sciLessonSort(a, b) {
  var ak = a.date + ' ' + (a.time || ''), bk = b.date + ' ' + (b.time || '');
  if (ak !== bk) return ak < bk ? -1 : 1;
  var ap = (a.periodLabels[0] || ''), bp = (b.periodLabels[0] || '');
  return ap < bp ? -1 : (ap > bp ? 1 : 0);
}
/* 授業数 = 学年ごとの通し番号（日付順で今年度の何コマ目か）。手で振らず、数えて出す */
function sciComputeSeq() {
  var by = {};
  state.sciLessons.forEach(function (l) { var k = l.grade + '|' + (l.cls || ''); (by[k] = by[k] || []).push(l); });   /* 通し番号は 学年×クラス ごと */
  Object.keys(by).forEach(function (g) {
    by[g].sort(sciLessonSort).forEach(function (l, i) { l.cseq = i + 1; });
  });
}
/* 単元計画側の「実施日」は左の授業から組み直す（紐づけを変えたとき画面だけ先に更新するため） */
function sciRebuildUnitLessons() {
  if (!state.science || !state.sciLessons) return;
  state.science.units.forEach(function (u) { u.lessons = []; });
  state.sciLessons.slice().sort(sciLessonSort).forEach(function (l) {
    var u = l.unitId ? sciUnitById(l.unitId) : null;
    if (u) u.lessons.push({ id: l.id, date: l.date, time: l.time, periodLabels: l.periodLabels });
  });
  sciComputeSeq();
}
function sciPlanOrder(grade) {
  var out = [];
  sciGroups(grade).forEach(function (g) { g.lessons.forEach(function (u) { out.push(u); }); });
  return out;
}
/* 次に紐づける本時の提案: 直前の授業が紐づく本時の「次」の、まだどの授業にも紐づいていない本時 */
function sciSuggest(lesson) {
  var P = sciPlanOrder(lesson.grade);
  if (!P.length) return null;
  var linked = {};
  state.sciLessons.forEach(function (l) { if (l.unitId && l.id !== lesson.id) linked[sciNorm(l.unitId)] = true; });
  var prev = null;
  state.sciLessons.filter(function (l) { return l.grade === lesson.grade && l.unitId && sciLessonSort(l, lesson) < 0; })
    .sort(sciLessonSort).forEach(function (l) { prev = l; });
  var start = 0;
  if (prev) {
    var pu = sciUnitById(prev.unitId);
    var pi = pu ? P.indexOf(pu) : -1;
    start = pi >= 0 ? pi + 1 : 0;
  }
  for (var i = start; i < P.length; i++) {
    if (linked[sciNorm(P[i].id)]) continue;
    if (!prev && P[i].status === 'Done') continue;
    return P[i];
  }
  return null;
}
function sciSelectLesson(id) {
  state.sciSel = state.sciSel === id ? null : id;
  var l = state.sciSel ? state.sciLessons.filter(function (x) { return x.id === id; })[0] : null;
  if (l) {
    var u = l.unitId ? sciUnitById(l.unitId) : sciSuggest(l);
    if (u) { state.sciGroup = sciGroupKey(u); if (l.unitId) state.sciOpenId = u.id; }
  }
  renderScienceTab();
}
function sciLink(lesson, unitId) {
  var prev = lesson.unitId;
  function apply(uid) {
    lesson.unitId = uid;
    sciRebuildUnitLessons();
    Store.updateLesson(lesson.id, { unitId: uid || null });
  }
  apply(unitId);
  var u = sciUnitById(unitId);
  showToast((u ? '「' + (u.name || '本時') + '」に紐づけました' : '紐づけを外しました'), function () { apply(prev || null); renderScienceTab(); });
  if (unitId) {                                    /* 続けて次の未紐づけの授業へ（順に振っていく流れ） */
    var next = state.sciLessons.filter(function (x) { return x.grade === lesson.grade && !x.unitId && sciLessonSort(x, lesson) > 0; }).sort(sciLessonSort)[0];
    if (next) { state.sciSel = null; sciSelectLesson(next.id); return; }
  }
  renderScienceTab();
}
function sciLessonRow(l) {
  var today = state.science.today;
  var sel = state.sciSel === l.id;
  var row = el('div', 'sci-lrow' + (sel ? ' sel' : '') + (l.date < today ? ' past' : ''));

  head.addEventListener('click', function () { sciSelectLesson(l.id); });

      go.type = 'button';

}
function sciLeftPane() {
  var pane = el('div', 'sci-left');

function renderScienceTab() {
  var root = $('#science-root');
  root.textContent = '';

  if (!state.science) {
    if (state.sciError) {
      var sb = el('div', 'stateband', '取得に失敗しました。（' + state.sciError + '）');
      var rb = el('button', null, '再読み込み');
      rb.addEventListener('click', function () { state.sciError = ''; renderScienceTab(); });
      sb.appendChild(rb);
      root.appendChild(sb);
      return;
    }
    root.appendChild(el('div', 'stateband', '読み込み中…'));
    if (renderScienceTab._loading) return;
    renderScienceTab._loading = true;
    Store.getScienceUnits(function (res) {
      renderScienceTab._loading = false;
      state.science = res || { units: [], today: realToday(), next: {} };
      sciInitSelection();
      if (state.mode === 'science') withTransition(renderScienceTab);
    }, function (e) {
      renderScienceTab._loading = false;
      state.sciError = (e && e.message) ? String(e.message).slice(0, 160) : '通信エラー';
      if (state.mode === 'science') renderScienceTab();
    });
    return;
  }

  /* 今年度の授業（左ペイン）は単元計画とは別に取る（失敗しても右は使える） */
  if (!state.sciLessons && !state.sciLessonsError && !renderScienceTab._lloading) {
    renderScienceTab._lloading = true;
    Store.getScienceLessons(function (res) {
      renderScienceTab._lloading = false;
      state.sciLessons = (res && res.lessons) || [];
      sciRebuildUnitLessons();
      if (state.mode === 'science') renderScienceTab();
    }, function (e) {
      renderScienceTab._lloading = false;
      state.sciLessonsError = (e && e.message) ? String(e.message).slice(0, 120) : '通信エラー';
      if (state.mode === 'science') renderScienceTab();
    });
  }

  /* 学年切替（＋狭い画面では 授業／単元 の切替） */
  var head = el('div', 'task-head');
  var seg = el('div', 'seg');
  seg.setAttribute('role', 'tablist');
  SCI_GRADES.forEach(function (g) {
    var b = el('button', null, g);
    b.setAttribute('role', 'tab');
    b.setAttribute('aria-selected', String(g === state.sciGrade));
    b.addEventListener('click', function () {
      if (g === state.sciGrade) return;
      state.sciGrade = g;
      state.sciGroup = sciFirstOpenGroup(g);
      state.sciOpenId = null;
      state.sciSel = null; state.sciClass = null;
      try { localStorage.setItem('dc.sciGrade', g); } catch (e) {}
      withTransition(renderScienceTab);
    });
    seg.appendChild(b);
  });
  head.appendChild(seg);
  var pt = el('div', 'seg sci-panetoggle');
  [['lessons', '授業'], ['units', '単元']].forEach(function (pr) {
    var b = el('button', null, pr[1]);
    b.setAttribute('aria-selected', String(state.sciPane === pr[0]));
    b.addEventListener('click', function () { state.sciPane = pr[0]; renderScienceTab(); });
    pt.appendChild(b);
  });
  head.appendChild(pt);
  root.appendChild(head);

  var cols = el('div', 'sci-cols');
  cols.dataset.pane = state.sciPane;
  cols.appendChild(sciLeftPane());
  var right = el('div', 'sci-right');
  cols.appendChild(right);
  root.appendChild(cols);

  var groups = sciGroups(state.sciGrade);
  if (!groups.length) { right.appendChild(el('div', 'doc-empty', 'この学年の単元計画はまだありません')); return; }

  groups.forEach(function (g) {
    var open = state.sciGroup === g.key;
    var gh = el('button', 'sci-ghead');
    gh.appendChild(el('span', 'no', g.no === 99 ? '' : String(g.no)));
    gh.appendChild(el('span', 'tn', g.name));
    if (g.area) gh.appendChild(el('span', 'area', g.area));
    var bar = el('span', 'sci-bar');
    var fill = document.createElement('i');
    fill.style.width = Math.round(100 * g.done / g.lessons.length) + '%';
    bar.appendChild(fill);
    gh.appendChild(bar);
    gh.appendChild(el('span', 'prog', g.done + '/' + g.lessons.length));
    gh.appendChild(el('span', 'caret', open ? '▼' : '▶'));
    gh.addEventListener('click', function () {
      state.sciGroup = open ? null : g.key;
      if (open) state.sciOpenId = null;
      renderScienceTab();
    });
    right.appendChild(gh);
    if (open) {
      var body = el('div', 'sci-body');
      g.lessons.forEach(function (u) { body.appendChild(sciLessonItem(u)); });
      right.appendChild(body);
    }
  });
}

function hush() {}
function withTransition(fn) {
  if (!document.startViewTransition) { fn(); return; }
  var vt = document.startViewTransition(fn);
  /* 連打で AbortError が飛ぶ。3本とも握りつぶす（行事予定入力アプリの教訓） */
  vt.ready.catch(hush); vt.finished.catch(hush); vt.updateCallbackDone.catch(hush);
}

var pendingFocus = null;   /* 月タブの日付クリック → 週タブでその日にフォーカスする */
function loadWeek(weekStart) {
  state.weekStart = weekStart;
  state.loading = true;
  state.error = false;
  /* スケルトン: 空 week を仮置きして枠と日付を即描く。
     week/selectedDate が null のまま描画に入ると mdw(null) で落ちる */
  state.week = emptyWeek(weekStart);
  /* ★週送りで表示日は動かさない（2026-09-18）。初回だけ今日に置く */
  if (!state.selectedDate) state.selectedDate = initialViewDate();
  refresh();
  Store.flush(function () {                    /* 書き込み中なら終わるのを待ってから読む */
  Store.getWeek(weekStart, function (payload) {
    if (payload.weekStart !== state.weekStart) return;   /* 連打で古い応答が来たら捨てる */
    state.week = payload;
    /* GAS では週 payload に全タスク（未完了全部＋この週の完了分）が同梱される。
       ダミーの器をそのまま実データに差し替える（タスクタブ・今日のタスク欄の元） */
    if (payload.allTasks) DUMMY_TASKS = payload.allTasks;
    state.projectNames = payload.projectNames || (IS_GAS ? {} : dummyProjectNames());
    state.loading = false;
    state.errorMsg = '';
    lastLoadAt = Date.now();
    state.relationTitles = payload.relationTitles || {};
    /* 週を取り直しても表示日はそのまま（2026-09-18）。月タブからの pendingFocus だけが日を動かす */
    if (pendingFocus) { state.selectedDate = pendingFocus; pendingFocus = null; }
    if (!state.selectedDate) state.selectedDate = initialViewDate();
    ensureDay(state.selectedDate);          /* 表示日が新しい週の外なら単日を取りに行く */
    withTransition(refresh);
  }, function (err) {
    if (weekStart !== state.weekStart) return;
    state.loading = false;
    state.error = true;
    state.errorMsg = (err && err.message) ? String(err.message) : '';
    state.week = emptyWeek(weekStart);
    if (!state.selectedDate) state.selectedDate = initialViewDate();   /* 失敗しても表示日は動かさない */
    refresh();
  });
  });
}

  /* Today: 開いた時刻で既定を選ぶ（昼前=Setup / 13時以降=Close）。
     「今どっちを開くか」を毎回考えさせないためで、上のセグメントでいつでも切り替えられる */
  if (state.mode === 'today') {
    if (!state.selectedDate) state.selectedDate = realToday();
    state.todayView = (new Date().getHours() >= 13) ? 'close' : 'setup';
  }
  if (state.mode === 'project') { state.projects = null; state.projectBodies = {}; }  /* タブに入るたび Notion から取り直す */
  if (state.mode === 'month') { state.months = {}; state.monthYm = null; state.monthSel = null; }   /* 〃（今月に戻す） */
  if (state.mode === 'often') { state.docs = null; state.docResults = null; state.docQuery = ''; state.docOpenId = null; }  /* 〃 */
  if (state.mode === 'science') { state.science = null; state.sciError = ''; state.sciDetail = {}; state.sciLessons = null; state.sciLessonsError = ''; state.sciSel = null; }  /* 〃 */
  withTransition(refresh);
});

/* Today タブ内のビュー切替（Setup / Close） */
$('#today-seg').addEventListener('click', function (e) {
  var b = e.target.closest('button[data-tview]');
  if (!b || b.dataset.tview === state.todayView) return;
  state.todayView = b.dataset.tview;
  withTransition(renderTodayTab);
});

/* 週ナビ（表の見出し行。PC・SP 共通ハンドラ。2026-09-09 にヘッダーからここへ移した） */
$all('.gridweeknav').forEach(function (nav) {
  nav.addEventListener('click', function (e) {
    var b = e.target.closest('button[data-wk]');
    if (!b || b.disabled) return;
    loadWeek(b.dataset.wk === 'today' ? mondayOf(MOCK_TODAY || jstTodayString())
                                      : addDays(state.weekStart, +b.dataset.wk));
  });
});
$('#btn-retry').addEventListener('click', function () { loadWeek(state.weekStart); });

/* 日送り（PC・SP 共通ロジック。PC は帯・日直等・今日のタスク・今日の情報だけを動かし、
   週グリッドは常に週表示のまま＝別状態。週境界を跨いだら loadWeek で週データごと切り替える（2026-09-09） */
/* 任意の日へ飛ぶ（カレンダー選択。2026-09-09）。
   ★2026-09-18: 週グリッドは動かさない。週の外の日でも、その日だけ取りに行って表示する
   （週を合わせたいときは、グリッド下の注記の「この日の週へ」を押す） */
function goToDate(d) { setViewDate(d); }

/* 日送り。週をまたいでも週グリッドは動かない（週境界を跨いだら loadWeek で切り替えるのは別経路）。
   ★2026-09-18: 以前は平日だけを送っていた（土日を飛ばして次の平日へ）が、土日にもタスクがある
   実運用に合わせて、土日も含めた全ての日を行き来できるようにした（本人指摘） */
function moveDay(delta) {
  var d = state.selectedDate || resolveToday().date;
  setViewDate(addDays(d, delta > 0 ? 1 : -1));
}
function goToToday() { setViewDate(resolveToday().date); }
$('#sp-prev').addEventListener('click', function () { moveDay(-1); });
$('#sp-next').addEventListener('click', function () { moveDay(1); });
$('#sp-head').addEventListener('click', goToToday);   /* 見出しタップ=今日に戻る */
$('#pc-prev').addEventListener('click', function () { moveDay(-1); });
$('#pc-next').addEventListener('click', function () { moveDay(1); });
$('#pc-today').addEventListener('click', goToToday);
$('#pc-cal-btn').innerHTML = ICON_CAL;
/* カレンダーから任意の日へ（2026-09-09）。週をまたぐ日でも goToDate が週ごと連れて行く */
$('#pc-date').addEventListener('change', function () {
  if (this.value) goToDate(this.value);
});

/* Day／Week／学校全体トグル（PC・SP 共通ハンドラ。2026-09-09、2026-09-18 に3択へ）。
   SP は Day（従来の日送りリスト）と学校全体の2択なので、Week を選んでいるときは Day を点ける */
function syncGridModeButtons() {
  $('#shell').dataset.gridmode = state.gridMode;
  $all('#gridmode-pc [data-gridmode]').forEach(function (btn) {
    btn.setAttribute('aria-selected', String(btn.dataset.gridmode === state.gridMode));
  });
  $all('#gridmode-sp [data-gridmode]').forEach(function (btn) {
    btn.setAttribute('aria-selected', String((btn.dataset.gridmode === 'school') === (state.gridMode === 'school')));
  });
}
function onGridModeClick(e) {
  var b = e.target.closest('button[data-gridmode]');
  if (!b || b.dataset.gridmode === state.gridMode) return;
  state.gridMode = b.dataset.gridmode;
  try { localStorage.setItem('dc.gridMode', state.gridMode); } catch (err) {}
  withTransition(function () {
    syncGridModeButtons();
    renderGrid();          /* Day ⇄ Week は同じ #grid に描き分ける */
    ensureSchoolWide();
  });
}
$('#gridmode-pc').addEventListener('click', onGridModeClick);
$('#gridmode-sp').addEventListener('click', onGridModeClick);

/* 区分フィルタ（2026-09-18）。Main は静的 HTML なので委任ハンドラ1本＋初期同期だけでよい */
function onKindFilterChange(e) {
  var cb = e.target.closest('input[type="checkbox"][data-kind]');
  if (!cb) return;
  setKindFilter(cb.dataset.kind, cb.checked);
}
$('#kindfilter-pc').addEventListener('change', onKindFilterChange);
$('#kindfilter-sp').addEventListener('change', onKindFilterChange);
syncKindFilterUI();

/* スワイプ（ライブラリなし）。画面端24pxは iOS エッジスワイプと競合するため無視 */
(function attachSwipe() {
  var pane = $('#pane-sp');
  var sx = null, sy = null;
  pane.addEventListener('touchstart', function (e) {
    var t = e.changedTouches[0];
    if (t.clientX < 24 || t.clientX > window.innerWidth - 24) { sx = null; return; }
    sx = t.clientX; sy = t.clientY;
  }, { passive: true });
  pane.addEventListener('touchcancel', function () { sx = null; }, { passive: true });
  pane.addEventListener('touchend', function (e) {
    if (sx == null) return;
    var t = e.changedTouches[0];
    var dx = t.clientX - sx, dy = t.clientY - sy;
    sx = null;
    if (Math.abs(dx) > 48 && Math.abs(dx) > 2 * Math.abs(dy)) moveDay(dx < 0 ? 1 : -1);
  }, { passive: true });
})();

/* 起動 */
injectIcons();
loadWeek(mondayOf(MOCK_TODAY || jstTodayString()));
</script>
</body>
</html>
